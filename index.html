<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<meta name="theme-color" content="#ffffff">
<style>
:root {
--bg: #ffffff;
--surface: #f8fafc;
--surface-hover: #eff6ff;
--primary: #4a9eff;
--primary-dark: #3b82f6;
--text: #1e293b;
--text-secondary: #64748b;
--text-tertiary: #94a3b8;
--text-disabled: #cbd5e1;
--border: #e2e8f0;
--border-light: #f1f5f9;
--border-heavy: #cbd5e1;
--shadow: rgba(0,0,0,0.06);
--shadow-primary: rgba(74,158,255,0.2);
--overlay-modal: rgba(0,0,0,0.55);
--error: #ef4444;
--error-bg: #fef2f2;
--success: #22c55e;
--radius-sm: 8px;
--radius: 12px;
--radius-lg: 16px;
--transition-fast: all .15s cubic-bezier(.4,0,.2,1);
--transition: all .25s cubic-bezier(.4,0,.2,1);
--font: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
--z-watermark: 2147483647;
--z-nav: 100;
--z-modal: 200;
--z-html: 300;
--z-img: 2147483646;
--z-toast: 500;
--z-announce: 999999
}
*,::before,::after {
box-sizing: border-box;
margin: 0;
padding: 0;
-webkit-tap-highlight-color: rgba(0,0,0,0)!important;
-webkit-touch-callout: none!important;
user-select: none!important;
outline: none!important
}
body {
font-family: var(--font);
background: var(--bg);
color: var(--text);
min-height: 100vh;
overflow-x: hidden;
font-size: 14px;
line-height: 1.6
}
img {
max-width: 100%;
display: block;
pointer-events: none;
-webkit-user-drag: none
}
#app {
display: flex;
flex-direction: column;
min-height: 100vh;
position: relative
}
#watermark-canvas {
position: fixed;
inset: 0;
pointer-events: none;
z-index: var(--z-watermark)
}
.mobile-header {
display: block;
background: var(--surface);
color: var(--text);
padding: 15px;
text-align: center;
font-size: 18px;
font-weight: 700;
border-bottom: 1px solid var(--border);
transition: var(--transition)
}
.content-area {
flex: 1;
overflow-y: auto;
padding: 12px;
padding-bottom: 80px;
position: relative;
-webkit-overflow-scrolling: touch
}
.list-item {
background: var(--surface);
border: 1px solid var(--border);
border-radius: var(--radius);
padding: 16px;
margin-bottom: 12px;
cursor: pointer;
transition: var(--transition);
position: relative;
overflow: hidden;
animation: itemIn .3s cubic-bezier(.4,0,.2,1) backwards
}
.list-item:nth-child(1) {
animation-delay: .02s
}
.list-item:nth-child(2) {
animation-delay: .04s
}
.list-item:nth-child(3) {
animation-delay: .06s
}
.list-item:nth-child(4) {
animation-delay: .08s
}
.list-item:nth-child(5) {
animation-delay: .10s
}
@keyframes itemIn {
from {
opacity: 0;
transform: translate3d(0,16px,0)
}
to {
opacity: 1;
transform: translate3d(0,0,0)
}
}
.list-item::before {
content: '';
position: absolute;
left: 0;
top: 0;
bottom: 0;
width: 4px;
background: var(--primary);
border-radius: var(--radius) 0 0 var(--radius);
transform: scaleY(0);
transition: transform .25s
}
.list-item:hover::before {
transform: scaleY(1)
}
.list-item:hover {
transform: translate3d(0,-3px,0);
border-color: var(--primary);
box-shadow: 0 8px 25px var(--shadow-primary)
}
.list-item .title {
font-size: 16px;
font-weight: 600;
margin-bottom: 8px;
color: var(--text)
}
.list-item .meta {
font-size: 12px;
color: var(--text-secondary)
}
.section-search {
display: none;
gap: 10px;
margin-bottom: 18px;
flex-wrap: wrap
}
.section-search.active {
display: flex;
animation: fadeInDown .3s ease
}
@keyframes fadeInDown {
from {
opacity: 0;
transform: translateY(-10px)
}
to {
opacity: 1;
transform: translateY(0)
}
}
.section-search input {
flex: 1;
min-width: 120px;
padding: 12px 16px;
border: 1.5px solid var(--border);
border-radius: var(--radius-sm);
background: var(--bg);
color: var(--text);
font-size: 14px;
user-select: text;
transition: var(--transition-fast)
}
.section-search input:focus {
border-color: var(--primary);
box-shadow: 0 0 0 3px var(--shadow-primary)
}
.section-search button {
padding: 12px 24px;
background: var(--primary);
color: #fff;
border: none;
border-radius: var(--radius-sm);
cursor: pointer;
font-size: 14px;
font-weight: 600;
transition: var(--transition-fast)
}
.section-search button:hover {
background: var(--primary-dark)
}
.section-search button:active {
transform: scale(0.95)
}
.section-search .search-history {
display: flex;
gap: 6px;
flex-wrap: wrap;
margin-top: 4px;
width: 100%;
align-items: center
}
.section-search .search-history span {
font-size: 11px;
padding: 4px 10px;
background: var(--border-light);
color: var(--text-secondary);
border-radius: 12px;
cursor: pointer;
transition: var(--transition-fast)
}
.section-search .search-history span:hover {
background: var(--surface-hover);
color: var(--primary)
}
.section-search .search-history .clear-history-btn {
font-size: 11px;
padding: 4px 10px;
background: var(--error-bg);
color: var(--error);
border-radius: 12px;
cursor: pointer;
border: 1px solid var(--error);
margin-left: auto
}
.section-search .search-history .clear-history-btn:hover {
background: var(--error);
color: #fff
}
.mobile-nav {
position: fixed;
bottom: 0;
left: 0;
right: 0;
height: 64px;
background: var(--surface);
border-top: 1px solid var(--border);
display: flex;
z-index: var(--z-nav);
backdrop-filter: blur(10px);
padding-bottom: env(safe-area-inset-bottom)
}
.mobile-nav button {
flex: 1;
background: none;
border: none;
height: 100%;
color: var(--text-tertiary);
cursor: pointer;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 3px;
transition: var(--transition-fast);
position: relative;
min-width: 0;
padding: 0 2px
}
.mobile-nav button.active {
color: var(--primary)
}
.mobile-nav button.active::before {
content: '';
position: absolute;
top: 0;
left: 50%;
transform: translateX(-50%);
width: 32px;
height: 3px;
background: var(--primary);
border-radius: 0 0 3px 3px;
animation: navBarIn .3s ease
}
@keyframes navBarIn {
from {
width: 0
}
to {
width: 32px
}
}
.mobile-nav button .nav-icon {
font-size: 22px;
line-height: 1
}
.mobile-nav button em {
font-style: normal;
font-size: 10px;
line-height: 1;
overflow: hidden;
text-overflow: ellipsis;
white-space: nowrap;
width: 100%;
text-align: center;
display: block
}
.mobile-nav button .nav-badge {
position: absolute;
top: 5px;
right: calc(50% - 24px);
background: var(--error);
color: #fff;
font-size: 9px;
padding: 1px 4px;
border-radius: 6px;
min-width: 14px;
text-align: center;
font-weight: 600
}
.modal {
position: fixed;
inset: 0;
background: var(--overlay-modal);
z-index: var(--z-modal);
display: flex;
align-items: center;
justify-content: center;
opacity: 0;
visibility: hidden;
transition: var(--transition);
backdrop-filter: blur(4px)
}
.modal.active {
opacity: 1;
visibility: visible
}
.modal-box {
background: var(--bg);
width: 92%;
max-width: 420px;
max-height: 85vh;
border-radius: var(--radius-lg);
display: flex;
flex-direction: column;
transform: scale(0.92) translate3d(0,20px,0);
transition: var(--transition);
overflow: hidden;
border: 1px solid var(--border);
box-shadow: 0 20px 60px rgba(0,0,0,0.16)
}
.modal.active .modal-box {
transform: scale(1) translate3d(0,0,0)
}
.modal-header {
padding: 18px 20px;
border-bottom: 1px solid var(--border);
display: flex;
justify-content: space-between;
align-items: center;
flex-shrink: 0
}
.modal-header h3 {
font-size: 17px;
color: var(--text);
font-weight: 600
}
.modal-close {
background: none;
border: none;
font-size: 26px;
cursor: pointer;
color: var(--text-tertiary);
line-height: 1;
padding: 4px 10px;
border-radius: var(--radius-sm);
display: flex;
align-items: center;
justify-content: center;
transition: var(--transition-fast)
}
.modal-close:hover {
background: var(--border-light);
color: var(--text)
}
.modal-body {
padding: 20px;
overflow-y: auto;
flex: 1;
-webkit-overflow-scrolling: touch
}
.modal-body .text {
white-space: pre-line;
line-height: 1.9;
margin-bottom: 20px;
color: var(--text);
font-size: 14px
}
.modal-body .text mark {
background: var(--primary);
color: #fff;
padding: 1px 3px;
border-radius: 3px
}
.img-grid {
display: flex;
flex-direction: column;
gap: 10px;
padding-bottom: 10px
}
.img-grid img {
border-radius: var(--radius-sm);
width: 100%;
object-fit: cover;
cursor: pointer;
display: block;
border: 1px solid var(--border);
transition: var(--transition-fast);
pointer-events: auto
}
.img-grid img:active {
transform: scale(0.97)
}
.copy-link-btn {
display: none;
margin: 0 auto 18px;
padding: 12px 0;
width: 60%;
min-width: 140px;
max-width: 240px;
background: linear-gradient(135deg,var(--primary),var(--primary-dark));
color: #fff;
border: none;
border-radius: var(--radius-sm);
font-size: 15px;
cursor: pointer;
text-align: center;
position: relative;
font-weight: 600;
transition: var(--transition-fast);
box-shadow: 0 4px 14px var(--shadow-primary)
}
.copy-link-btn:hover {
box-shadow: 0 6px 20px var(--shadow-primary);
transform: translate3d(0,-1px,0)
}
.copy-link-btn.show {
display: block!important
}
.html-modal {
position: fixed;
inset: 0;
background: rgba(0,0,0,0.65);
z-index: var(--z-html);
display: flex;
align-items: center;
justify-content: center;
opacity: 0;
visibility: hidden;
transition: var(--transition)
}
.html-modal.active {
opacity: 1;
visibility: visible
}
.html-modal-box {
background: var(--bg);
width: 95%;
max-width: 460px;
height: 88vh;
border-radius: var(--radius-lg);
display: flex;
flex-direction: column;
transform: scale(0.92) translate3d(0,20px,0);
transition: var(--transition);
overflow: hidden;
border: 1px solid var(--border);
box-shadow: 0 20px 60px rgba(0,0,0,0.16)
}
.html-modal.active .html-modal-box {
transform: scale(1) translate3d(0,0,0)
}
.html-modal-header {
padding: 18px 20px;
border-bottom: 1px solid var(--border);
display: flex;
justify-content: space-between;
align-items: center;
flex-shrink: 0
}
.html-modal-header h3 {
font-size: 17px;
color: var(--text);
font-weight: 600
}
.html-modal-close {
background: none;
border: none;
font-size: 26px;
cursor: pointer;
color: var(--text-tertiary);
line-height: 1;
padding: 4px 10px;
border-radius: var(--radius-sm);
display: flex;
align-items: center;
justify-content: center;
transition: var(--transition-fast)
}
.html-modal-close:hover {
background: var(--border-light);
color: var(--text)
}
.html-modal-body {
flex: 1;
overflow: auto;
padding: 0;
position: relative
}
.html-modal-body * {
user-select: text!important
}
.html-modal-body iframe {
width: 100%;
height: 100%;
border: none;
display: block
}
.html-reload-btn {
display: inline-block;
margin-left: 10px;
padding: 6px 14px;
background: var(--border-light);
color: var(--text);
font-size: 13px;
border: none;
border-radius: var(--radius-sm);
cursor: pointer;
vertical-align: middle;
transition: var(--transition-fast)
}
.html-reload-btn:hover {
background: var(--border)
}
.show-html-btn {
display: block!important;
margin: 0 auto 18px;
padding: 12px 0;
width: 60%;
min-width: 140px;
max-width: 240px;
background: linear-gradient(135deg,var(--primary),var(--primary-dark));
color: #fff;
border: none;
border-radius: var(--radius-sm);
font-size: 15px;
cursor: pointer;
text-align: center;
position: relative;
font-weight: 600;
transition: var(--transition-fast);
box-shadow: 0 4px 14px var(--shadow-primary)
}
.show-html-btn:hover {
box-shadow: 0 6px 20px var(--shadow-primary)
}
.show-html-btn:active {
transform: scale(0.96)
}
.img-modal {
position: fixed;
inset: 0;
background: rgba(0,0,0,0.98);
z-index: var(--z-img);
display: flex;
align-items: center;
justify-content: center;
opacity: 0;
visibility: hidden;
transition: var(--transition);
backdrop-filter: blur(8px)
}
.img-modal.active {
opacity: 1;
visibility: visible
}
.img-modal .img-container {
position: relative;
width: 100%;
height: 100%;
display: flex;
align-items: center;
justify-content: center
}
.img-modal .img-container img {
max-width: 100vw;
max-height: 100vh;
width: auto;
height: auto;
object-fit: contain;
display: block;
user-select: none;
-webkit-user-drag: none;
cursor: zoom-out
}
.img-modal .img-watermark {
position: absolute;
inset: 0;
display: flex;
align-items: center;
justify-content: center;
flex-wrap: wrap;
pointer-events: none;
z-index: 10;
overflow: hidden
}
.img-modal .img-watermark span {
display: block;
width: 100%;
text-align: center;
font-size: clamp(16px,4vw,32px);
font-weight: 700;
transform: rotate(-12deg);
letter-spacing: 2px;
text-shadow: 0 1px 4px rgba(0,0,0,0.5);
animation: imgWmCycle 4s linear infinite
}
@keyframes imgWmCycle {
0% {
color: #22c55e
}
25% {
color: #ef4444
}
50% {
color: #3b82f6
}
75% {
color: #eab308
}
100% {
color: #22c55e
}
}
.img-modal .img-hint {
position: absolute;
bottom: 16px;
left: 50%;
transform: translateX(-50%);
background: rgba(0,0,0,0.6);
color: rgba(255,255,255,0.7);
font-size: 12px;
padding: 6px 14px;
border-radius: 20px;
pointer-events: none;
opacity: 0;
transition: opacity .3s
}
.img-modal.active .img-hint {
opacity: 1;
transition-delay: .5s
}
.loading {
padding: 50px;
text-align: center;
color: var(--text-secondary);
font-size: 15px
}
.loading-sub {
display: inline-block;
margin-left: 8px;
color: var(--primary);
font-size: 13px;
font-weight: 500
}
.loading-bar {
width: 100%;
height: 3px;
background: var(--border);
margin-top: 12px;
border-radius: 2px;
overflow: hidden
}
.loading-bar::after {
content: '';
display: block;
width: 40%;
height: 100%;
background: linear-gradient(90deg,transparent,var(--primary),transparent);
border-radius: 2px;
animation: loadingSlide 1.5s infinite
}
@keyframes loadingSlide {
0% {
transform: translateX(-100%)
}
100% {
transform: translateX(350%)
}
}
.pager {
display: flex;
justify-content: center;
align-items: center;
gap: 12px;
padding: 20px;
white-space: nowrap
}
.pager button {
padding: 12px 24px;
border: none;
background: var(--primary);
color: #fff;
border-radius: var(--radius-sm);
cursor: pointer;
font-size: 14px;
font-weight: 600;
transition: var(--transition-fast)
}
.pager button:hover {
background: var(--primary-dark);
box-shadow: 0 4px 12px var(--shadow-primary)
}
.pager button:disabled {
background: var(--text-disabled)!important;
cursor: not-allowed!important;
opacity: 0.35!important;
box-shadow: none!important
}
.pager button:active:not(:disabled) {
transform: scale(0.95)
}
.pager .page-info {
line-height: 40px;
color: var(--text-secondary);
font-size: 13px;
font-weight: 500
}
.toast {
position: fixed;
top: 20px;
left: 50%;
transform: translateX(-50%) translateY(-100px);
background: var(--text);
border: 1px solid var(--border-heavy);
color: var(--bg);
padding: 12px 24px;
border-radius: var(--radius-sm);
z-index: var(--z-toast);
transition: transform .35s cubic-bezier(.4,0,.2,1);
font-size: 14px;
font-weight: 500;
box-shadow: 0 8px 30px rgba(0,0,0,0.16);
pointer-events: none
}
.toast.show {
transform: translateX(-50%) translateY(0)
}
.toast.toast-success {
background: var(--success);
color: #fff
}
.sentinel {
height: 1px;
width: 100%;
margin-top: 10px
}
.err {
text-align: center;
color: var(--error);
font-weight: bold;
padding: 30px 15px;
font-size: 14px;
line-height: 1.8
}
.announcement-overlay {
position: fixed;
inset: 0;
background: rgba(0,0,0,0.72);
z-index: calc(var(--z-announce) - 1);
backdrop-filter: blur(6px)
}
.announcement-overlay.show {
display: block
}
.announcement-modal {
position: fixed;
top: 50%;
left: 50%;
transform: translate(-50%,-50%);
background: var(--bg);
border: 1px solid var(--border);
border-radius: var(--radius-lg);
box-shadow: 0 24px 70px rgba(0,0,0,0.35);
z-index: var(--z-announce);
width: 94%;
max-width: 560px;
max-height: 86vh;
display: flex;
flex-direction: column;
opacity: 0;
visibility: hidden;
transition: var(--transition);
pointer-events: none
}
.announcement-modal.active {
opacity: 1;
visibility: visible;
pointer-events: auto
}
.announcement-modal .announcement-box {
padding: 26px 24px;
display: flex;
flex-direction: column;
flex: 1;
min-height: 0
}
.announcement-header h3 {
font-size: 19px;
color: var(--text);
margin-bottom: 14px;
font-weight: 700;
text-align: center
}
.announcement-body {
font-size: 14px;
color: var(--text-secondary);
margin-bottom: 20px;
line-height: 1.7;
overflow-y: auto;
flex: 1;
padding-right: 4px
}
.announcement-body::-webkit-scrollbar {
width: 4px
}
.announcement-body::-webkit-scrollbar-track {
background: var(--border-light)
}
.announcement-body::-webkit-scrollbar-thumb {
background: var(--border-heavy);
border-radius: 2px
}
.announcement-progress {
width: 100%;
height: 4px;
background: var(--border-light);
border-radius: 2px;
overflow: hidden;
margin-bottom: 14px
}
.announcement-progress span {
display: block;
height: 100%;
width: 0%;
background: var(--primary);
border-radius: 2px;
transition: width .3s ease
}
.announcement-tip {
font-size: 12px;
text-align: center;
min-height: 18px;
line-height: 1.4;
margin-bottom: 6px
}
.announcement-footer {
padding: 0 2px
}
.announcement-btn {
padding: 13px 20px;
background: var(--primary);
color: #fff;
border: none;
border-radius: var(--radius-sm);
cursor: pointer;
font-size: 15px;
font-weight: 600;
width: 100%;
transition: var(--transition-fast)
}
.announcement-btn:hover {
background: var(--primary-dark)
}
.announcement-btn:active {
transform: scale(0.98)
}
body.announce-lock {
overflow: hidden!important;
height: 100vh!important
}
body.announce-lock .content-area {
overflow: hidden!important
}
body:not(.announce-lock) {
overflow: auto!important;
height: auto!important
}
body:not(.announce-lock) .content-area {
overflow-y: auto!important;
filter: none!important;
opacity: 1!important
}
@media(max-width: 768px) {
.announcement-modal {
width:96%;
max-height: 82vh
}
.modal-box {
width: 95%;
max-height: 80vh
}
.html-modal-box {
width: 95%;
height: 80vh
}
.show-html-btn {
width: 50%!important
}
.copy-link-btn {
width: 50%!important
}
}
.music-player {
position: fixed;
right: 16px;
bottom: 80px;
z-index: 450;
display: flex;
flex-direction: column;
align-items: flex-end;
gap: 8px
}
.music-toggle {
width: 46px;
height: 46px;
border-radius: 50%;
background: var(--primary);
color: #fff;
border: none;
font-size: 20px;
cursor: pointer;
