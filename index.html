<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>天彬TianBIN | 框架设定官网</title><link rel="icon" href="https://wentianwan.com/favicon.ico"><meta name="description" content="不忘初心，逐梦未来。框架设定：TIANBIN.NET,志创旷世神作，玄幻科幻并峙，策略养成，二次元为皮。构思已备，恨无资斧践行。框架设定，并陈未铸。空怀奇想，怅望星河，惟叹奈何。剑鸣匣中谁识，待伯乐携金共铸，以竟此界。版权所有:苏天彬,本名李文飞,字天彬"><meta name="keywords" content="天彬,TianBIN,天彬TianBIN,不忘初心,逐梦未来,世界观,框架,设定,玄幻,科幻,二次元,游戏,小说,版权,李文飞,苏天彬">
<style>
:root{color-scheme:light!important}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#1e293b;overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100vh}
#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;background:url(https://tianbin.net/bg/main.jpg) center/cover no-repeat;opacity:.12}
#watermark{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2147483647;overflow:hidden}
#app{max-width:860px;margin:0 auto;padding:20px 16px 100px}
.search-bar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:14px 18px;display:flex;gap:10px;border-radius:0 0 16px 16px;box-shadow:0 1px 20px rgba(0,0,0,.08);margin-bottom:16px}
.search-bar input{flex:1;border:1.5px solid #e2e8f0;border-radius:12px;padding:12px 16px;font-size:15px;outline:none;transition:border .25s,box-shadow .25s;background:#f8fafc}
.search-bar input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.search-bar button{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:12px;padding:12px 22px;font-size:15px;font-weight:500;cursor:pointer;white-space:nowrap;transition:transform .15s,box-shadow .15s}
.search-bar button:active{transform:scale(.97)}
.search-bar button:hover{box-shadow:0 4px 14px rgba(99,102,241,.35)}
.list{padding:4px 0}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.03);cursor:pointer;transition:transform .2s,box-shadow .2s;border:1px solid rgba(226,232,240,.6)}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.04)}
.card:active{transform:scale(.99)}
.card h3{font-size:17px;font-weight:600;margin-bottom:8px;color:#0f172a;line-height:1.4}
.card .meta{font-size:12px;color:#a0aec0;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card .meta .tag{background:#f1f5f9;padding:2px 8px;border-radius:6px;font-size:11px}
.card .preview{font-size:14px;color:#64748b;line-height:1.7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .imgs{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.card .imgs img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid #f1f5f9;transition:transform .2s}
.card .imgs img:hover{transform:scale(1.08)}
#bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(226,232,240,.8);display:flex;z-index:200;height:64px;padding-bottom:env(safe-area-inset-bottom)}
#bottom-nav .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#94a3b8;cursor:pointer;position:relative;transition:color .2s}
#bottom-nav .nav-item.active{color:#6366f1}
#bottom-nav .nav-item .icon{font-size:22px;margin-bottom:3px;transition:transform .2s}
#bottom-nav .nav-item.active .icon{transform:scale(1.15)}
#bottom-nav .badge{position:absolute;top:6px;right:50%;margin-right:-26px;width:7px;height:7px;background:#ef4444;border-radius:50%}
#announcement-mask{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
#announcement-box{background:#fff;border-radius:20px;max-width:520px;width:100%;max-height:82vh;overflow-y:auto;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
#announcement-box h2{text-align:center;margin-bottom:18px;color:#0f172a;font-size:20px;font-weight:700}
#announcement-box .content{line-height:1.9;color:#64748b;margin-bottom:18px;white-space:pre-line;font-size:14px}
#announcement-box .images{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
#announcement-box .images img{width:100%;max-height:220px;object-fit:cover;border-radius:12px}
#announcement-box .html-content{margin-bottom:18px;font-size:14px}
#announcement-box .countdown-btn{width:100%;padding:16px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;transition:opacity .2s,transform .15s}
#announcement-box .countdown-btn:disabled{background:#cbd5e1;cursor:not-allowed}
#announcement-box .countdown-btn:not(:disabled):active{transform:scale(.98)}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(15,23,42,.88);color:#fff;padding:14px 28px;border-radius:12px;font-size:14px;z-index:99999;opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(8px)}
#music-player{position:fixed;right:18px;bottom:80px;z-index:300}
#music-toggle{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;font-size:22px;cursor:pointer;box-shadow:0 4px 16px rgba(99,102,241,.4);display:flex;align-items:center;justify-content:center;transition:transform .2s}
#music-toggle:active{transform:scale(.93)}
#playlist-panel{position:fixed;right:18px;bottom:136px;background:#fff;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.12);border:1px solid rgba(226,232,240,.6);width:280px;max-height:320px;overflow-y:auto;z-index:300;display:none}
#playlist-panel.show{display:block}
#playlist-panel .song-item{padding:12px 16px;font-size:14px;cursor:pointer;border-bottom:1px solid #f8fafc;display:flex;align-items:center;gap:10px;transition:background .15s}
#playlist-panel .song-item:last-child{border-bottom:none}
#playlist-panel .song-item:hover{background:#f8fafc}
#playlist-panel .song-item.active{color:#6366f1;background:#f5f3ff}
#playlist-panel .song-item .play-icon{font-size:12px;opacity:0;color:#6366f1}
#playlist-panel .song-item.active .play-icon{opacity:1}
#music-controls{position:fixed;right:72px;bottom:80px;z-index:300;display:none;gap:8px}
#music-controls.show{display:flex}
#music-controls button{width:36px;height:36px;border-radius:50%;border:1.5px solid #6366f1;background:#fff;color:#6366f1;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
#music-controls button:hover{background:#6366f1;color:#fff}
#detail-mask{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px}
#detail-box{background:#fff;border-radius:20px;max-width:640px;width:100%;max-height:84vh;overflow-y:auto;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
#detail-box h2{margin-bottom:14px;color:#0f172a;font-size:20px;font-weight:700}
#detail-box .detail-meta{font-size:13px;color:#a0aec0;margin-bottom:16px;display:flex;gap:10px;align-items:center}
#detail-box .detail-meta .tag{background:#f1f5f9;padding:3px 10px;border-radius:8px;font-size:12px}
#detail-box .detail-content{line-height:1.9;color:#475569;white-space:pre-line;font-size:15px}
#detail-box .detail-imgs{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
#detail-box .detail-imgs img{width:88px;height:88px;object-fit:cover;border-radius:12px;cursor:pointer;border:1px solid #f1f5f9;transition:transform .2s}
#detail-box .detail-imgs img:hover{transform:scale(1.08)}
#detail-box .close-btn{margin-top:20px;width:100%;padding:14px;background:#f1f5f9;color:#475569;border:none;border-radius:12px;font-size:15px;font-weight:500;cursor:pointer;transition:background .2s}
#detail-box .close-btn:hover{background:#e2e8f0}
#img-preview-mask{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);z-index:99999;display:none;align-items:center;justify-content:center}
#img-preview-mask img{max-width:92%;max-height:92%;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.3)}
#html-frame-mask{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);z-index:99999;display:none;align-items:center;justify-content:center;padding:20px}
#html-frame-mask iframe{width:100%;height:82vh;border:none;border-radius:16px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.2)}
#html-frame-mask .close-frame{position:absolute;top:24px;right:24px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);color:#333;border:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.15)}
#op-result{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:20px;padding:28px;max-width:440px;width:92%;z-index:9999;display:none;box-shadow:0 20px 60px rgba(0,0,0,.2);border:1px solid rgba(226,232,240,.6)}
#op-result.show{display:block}
#op-result h3{margin-bottom:14px;color:#0f172a;font-size:18px;font-weight:600}
#op-result .op-content{line-height:1.9;color:#64748b;font-size:14px}
#op-result .op-close{margin-top:18px;width:100%;padding:12px;background:#f1f5f9;border:none;border-radius:12px;cursor:pointer;font-size:14px;transition:background .2s}
#op-result .op-close:hover{background:#e2e8f0}
#loading{text-align:center;padding:60px 20px;color:#94a3b8;font-size:15px}
#loading::after{content:'';display:inline-block;width:24px;height:24px;border:3px solid #e2e8f0;border-top-color:#6366f1;border-radius:50%;animation:spin 1s linear infinite;margin-left:10px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}
.section-header{font-size:13px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;margin:8px 4px 12px;display:flex;align-items:center;gap:8px}
.section-header::after{content:'';flex:1;height:1px;background:linear-gradient(to right,#e2e8f0,transparent)}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="watermark"></canvas>
<div id="announcement-mask"><div id="announcement-box"></div></div>
<div id="app"><div id="loading">加载中</div></div>
<div id="bottom-nav"></div>
<div id="music-player"><button id="music-toggle">🎵</button></div>
<div id="music-controls"><button id="prev-btn">◀</button><button id="next-btn">▶</button></div>
<div id="playlist-panel"></div>
<audio id="audio" preload="none"></audio>
<div id="toast"></div>
<div id="detail-mask"><div id="detail-box"><div id="detail-content"></div><button class="close-btn" onclick="closeDetail()">关闭</button></div></div>
<div id="img-preview-mask"><img id="img-preview" src=""></div>
<div id="html-frame-mask"><button class="close-frame" onclick="closeHtmlFrame()">✕</button><iframe id="html-frame"></iframe></div>
<div id="op-result"><h3 id="op-title"></h3><div class="op-content" id="op-content"></div><button class="op-close" onclick="closeOpResult()">关闭</button></div>

<script>
let config={},announcementData={},allData=[],currentData=[],currentSection='api',audio=document.getElementById('audio'),currentSongIndex=0,playlist=[],isPlaying=false;

(async function init(){
  try{
    const[cfgRes,annRes]=await Promise.all([
      fetch('https://api.tianbin.org/api/index.json'),
      fetch('https://api.tianbin.org/index.json')
    ]);
    config=await cfgRes.json();
    announcementData=await annRes.json();
    document.title=config.siteName||'天彬TianBIN';
    applySecurity();
    applyWatermark();
    applyBackground();
    renderBottomNav();
    await showAnnouncement();
    await loadSection(config.homeId||'api');
    initMusic();
    initSearch();
    document.getElementById('loading').style.display='none';
  }catch(e){
    document.getElementById('loading').textContent=config.errorMessages?.loadFailed||'加载失败，请刷新重试';
  }
})();

function applySecurity(){
  if(!config.security)return;
  const s=config.security;
  if(s.blockContextMenu)document.addEventListener('contextmenu',e=>e.preventDefault());
  if(s.blockF12)document.addEventListener('keydown',e=>{if(e.key==='F12')e.preventDefault()});
  if(s.blockCtrlU)document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='u')e.preventDefault()});
  if(s.blockCtrlS)document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s')e.preventDefault()});
  if(s.blockCopy)document.addEventListener('copy',e=>e.preventDefault());
  if(s.blockPrint)document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='p')e.preventDefault()});
  if(s.devtoolsRedirect){setInterval(()=>{if(window.outerHeight-window.innerHeight>100||window.outerWidth-window.innerWidth>100)window.location.href=s.devtoolsRedirect},1000)}
}

function applyWatermark(){
  if(!config.security?.watermarkText)return;
  const canvas=document.getElementById('watermark'),ctx=canvas.getContext('2d');
  function draw(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='rgba(0,0,0,0.05)';ctx.font='13px sans-serif';ctx.rotate(-0.25);for(let x=0;x<canvas.width+200;x+=200){for(let y=0;y<canvas.height+100;y+=110){ctx.fillText(config.security.watermarkText,x-80,y)}}}
  draw();setInterval(draw,150);
}

function applyBackground(){
  if(config.background?.src){document.getElementById('bg').style.backgroundImage=`url(${config.background.src})`}
}

async function showAnnouncement(){
  return new Promise(resolve=>{
    if(!announcementData.enabled){resolve();return}
    const box=document.getElementById('announcement-box');
    let html=`<h2>${announcementData.title||'公告'}</h2>`;
    if(announcementData.content)html+=`<div class="content">${announcementData.content}</div>`;
    if(announcementData.images&&announcementData.images.length)html+=`<div class="images">${announcementData.images.map(s=>`<img src="${s}" onclick="previewImg('${s}')">`).join('')}</div>`;
    if(announcementData.html)html+=`<div class="html-content">${announcementData.html}</div>`;
    let countdown=announcementData.countdown||0;
    html+=`<button class="countdown-btn" id="ann-ok" ${countdown>0?'disabled':''}>${countdown>0?`请阅读条款（${countdown}s）`:'我同意'}</button>`;
    box.innerHTML=html;
    document.getElementById('announcement-mask').style.display='flex';
    if(countdown>0){const btn=document.getElementById('ann-ok');const timer=setInterval(()=>{countdown--;if(countdown<=0){clearInterval(timer);btn.disabled=false;btn.textContent='我同意'}else{btn.textContent=`请阅读条款（${countdown}s）`}},1000)}
    document.getElementById('ann-ok').onclick=()=>{document.getElementById('announcement-mask').style.display='none';resolve()};
  });
}

function renderBottomNav(){
  const nav=document.getElementById('bottom-nav');
  nav.innerHTML=config.bottomNav.map(item=>`<div class="nav-item ${item.id===config.homeId?'active':''}" data-id="${item.id}" onclick="switchSection('${item.id}')"><span class="icon">${item.icon}</span>${item.name}${item.badge?'<span class="badge"></span>':''}</div>`).join('');
}

async function loadSection(id){
  currentSection=id;
  document.querySelectorAll('#bottom-nav .nav-item').forEach(el=>el.classList.toggle('active',el.dataset.id===id));
  const section=config.sections[id];
  if(!section){document.getElementById('app').innerHTML='<div id="loading">暂无内容</div>';return}
  document.getElementById('app').innerHTML='<div id="loading">加载中</div>';
  try{
    const res=await fetch(config.apiBase+section.api);
    const data=await res.json();
    allData=data;currentData=data;
    renderList(data,section);
  }catch(e){
    document.getElementById('app').innerHTML=`<div id="loading">${config.errorMessages?.loadFailed||'加载失败'}</div>`;
  }
}

function renderList(data,section){
  const app=document.getElementById('app');
  if(!data||data.length===0){app.innerHTML=`<div id="loading">${config.errorMessages?.emptyContent||'暂无内容'}</div>`;return}
  let html=`<div class="section-header">${section.name||''}</div><div class="list">`;
  const sorted=[...data].sort((a,b)=>{const sa=section.sortOrder==='desc'?-1:1;if(section.sortBy==='date')return sa*(new Date(b.date||0)-new Date(a.date||0));if(section.sortBy==='id')return sa*((b.id||0)-(a.id||0));return 0});
  sorted.slice(0,section.perPage).forEach(item=>{
    html+=`<div class="card" onclick='openDetail(${JSON.stringify(item).replace(/'/g,"&#39;")})'><h3>${item.title}</h3><div class="meta"><span class="tag">${item.date||'无日期'}</span>${item.author?`<span class="tag">${item.author}</span>`:''}</div><div class="preview">${item.content||''}</div>${item.imgs&&item.imgs.length?`<div class="imgs">${item.imgs.slice(0,4).map(s=>`<img src="${s}" onclick="event.stopPropagation();previewImg('${s}')">`).join('')}</div>`:''}</div>`;
  });
  html+='</div>';
  app.innerHTML=html;
}

function openDetail(item){
  const box=document.getElementById('detail-content');
  let html=`<h2>${item.title}</h2><div class="detail-meta"><span class="tag">${item.date||'无日期'}</span>${item.author?`<span class="tag">${item.author}</span>`:''}</div><div class="detail-content">${item.content||''}</div>`;
  if(item.imgs&&item.imgs.length)html+=`<div class="detail-imgs">${item.imgs.map(s=>`<img src="${s}" onclick="previewImg('${s}')">`).join('')}</div>`;
  if(item.html)html+=`<div style="margin-top:16px"><button onclick="openHtmlFrame(${JSON.stringify(item.html).replace(/'/g,"&#39;")})" style="padding:10px 20px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:14px;font-weight:500">详细条款内容</button></div>`;
  box.innerHTML=html;document.getElementById('detail-mask').style.display='flex';
}

function closeDetail(){document.getElementById('detail-mask').style.display='none'}

function previewImg(src){document.getElementById('img-preview').src=src;document.getElementById('img-preview-mask').style.display='flex'}
document.getElementById('img-preview-mask').onclick=()=>document.getElementById('img-preview-mask').style.display='none';

function openHtmlFrame(html){document.getElementById('html-frame').srcdoc=html;document.getElementById('html-frame-mask').style.display='flex'}
function closeHtmlFrame(){document.getElementById('html-frame-mask').style.display='none'}

function initSearch(){
  const nav=document.getElementById('bottom-nav');
  const searchBar=document.createElement('div');searchBar.className='search-bar';
  searchBar.innerHTML=`<input type="text" id="search-input" placeholder="搜索..."><button id="search-btn">搜索</button>`;
  nav.parentNode.insertBefore(searchBar,nav);
  document.getElementById('search-btn').onclick=doSearch;
  document.getElementById('search-input').onkeydown=e=>{if(e.key==='Enter')doSearch()};
}

function doSearch(){
  const q=document.getElementById('search-input').value.trim();
  const section=config.sections[currentSection];
  if(!q){renderList(allData,section);return}
  if(section.opEnabled&&config.opSearch?.enabled&&/^\d+$/.test(q)){
    const found=allData.find(item=>item.id===q);
    if(found){showOpResult(found);return}
    else{showToast(config.opSearch.notFoundText||'未找到');return}
  }
  const filtered=allData.filter(item=>{
    const fields=section.searchFields||['title','content'];
    return fields.some(f=>item[f]&&item[f].toString().toLowerCase().includes(q.toLowerCase()));
  });
  renderList(filtered,section);
}

function showOpResult(item){
  document.getElementById('op-title').textContent=item.title;
  document.getElementById('op-content').innerHTML=`<span class="tag" style="background:#f1f5f9;padding:3px 10px;border-radius:8px;font-size:12px">${item.date||''}</span> ${item.author?`<span class="tag" style="background:#f1f5f9;padding:3px 10px;border-radius:8px;font-size:12px">${item.author}</span>`:''}<br><br>${item.content||''}`;
  document.getElementById('op-result').classList.add('show');
}

function closeOpResult(){document.getElementById('op-result').classList.remove('show')}

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);
}
function initMusic(){
  if(!config.music?.enabled)return;
  playlist=config.music.list||[];
  if(playlist.length===0)return;
  const toggle=document.getElementById('music-toggle');
  const panel=document.getElementById('playlist-panel');
  const controls=document.getElementById('music-controls');
  toggle.onclick=()=>{if(panel.style.display==='block'){panel.style.display='none';controls.classList.remove('show')}else{renderPlaylist();panel.style.display='block';controls.classList.add('show')}};
  document.getElementById('prev-btn').onclick=prevSong;
  document.getElementById('next-btn').onclick=nextSong;
  audio.onended=nextSong;
  audio.volume=config.music.volume||0.7;
  loadSong(config.music.defaultIndex||0);
  toggle.addEventListener('mouseenter',()=>controls.classList.add('show'));  document.getElementById('music-player').addEventListener('mouseleave',()=>{controls.classList.remove('show');panel.style.display='none'});
}
function renderPlaylist(){
  const panel=document.getElementById('playlist-panel');
  panel.innerHTML=playlist.map((s,i)=>`<div class="song-item ${i===currentSongIndex?'active':''}" onclick="playSong(${i})"><span class="play-icon">▶</span><div><div style="font-weight:500">${s.name}</div><div style="font-size:12px;color:#a0aec0">${s.artist||'未知'}</div></div></div>`).join('');
}
function loadSong(index){
  if(index<0||index>=playlist.length)return;
  currentSongIndex=index;const song=playlist[index];
  if(song.type==='netease')audio.src=`https://music.163.com/song/media/outer/url?id=${song.id}.mp3`;
  else if(song.type==='url')audio.src=song.url;
  else audio.src='';
  renderPlaylist();
}
function playSong(index){
  loadSong(index);audio.play().then(()=>{isPlaying=true;showToast(playlist[index].name)}).catch(()=>showToast('播放失败，自动跳下一首'));
}
function prevSong(){currentSongIndex=(currentSongIndex-1+playlist.length)%playlist.length;loadSong(currentSongIndex);if(isPlaying)audio.play()}
function nextSong(){currentSongIndex=(currentSongIndex+1)%playlist.length;loadSong(currentSongIndex);if(isPlaying)audio.play()}
</script>
</body>
</html>
