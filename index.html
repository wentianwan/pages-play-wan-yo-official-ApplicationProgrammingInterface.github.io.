<style>
:root {
--bg: #ffffff;
--surface: #f8fafc;
--surface-hover: #eff6ff;
--primary: #4a9eff;
--primary-dark: #3b82f6;
--text: #1e293b;
--text-secondary: #64748b;
--text-tertiary: #94a3b8;
--text-disabled: #cbd5e1;
--border: #e2e8f0;
--border-light: #f1f5f9;
--border-heavy: #cbd5e1;
--shadow: rgba(0,0,0,0.06);
--shadow-primary: rgba(74,158,255,0.2);
--overlay-modal: rgba(0,0,0,0.55);
--error: #ef4444;
--error-bg: #fef2f2;
--success: #22c55e;
--radius-sm: 8px;
--radius: 12px;
--radius-lg: 16px;
--transition-fast: all .15s cubic-bezier(.4,0,.2,1);
--transition: all .25s cubic-bezier(.4,0,.2,1);

--z-html: 300;
--z-img: 2147483646;
--z-toast: 500;
--z-announce: 999999;
--z-music: 900;
--z-music-btn: 950;
--z-announce-overlay: 999998;
}
*,::before,::after {
box-sizing: border-box;
margin: 0;
padding: 0;
-webkit-tap-highlight-color: rgba(0,0,0,0)!important;
-webkit-touch-callout: none!important;
user-select: none!important;
outline: none!important
}
body {
font-family: var(--font);
background: var(--bg);
color: var(--text);
min-height: 100vh;
overflow-x: hidden;
font-size: 14px;
line-height: 1.6
}
img {
max-width: 100%;
display: block;
pointer-events: none;
-webkit-user-drag: none
}
#app {
display: flex;
flex-direction: column;
min-height: 100vh;
position: relative
}
#watermark-canvas {
position: fixed;
inset: 0;
pointer-events: none;
z-index: var(--z-watermark)
}
.mobile-header {
display: block;
background: var(--surface);
color: var(--text);
padding: 15px;
text-align: center;
font-size: 18px;
font-weight: 700;
border-bottom: 1px solid var(--border);
transition: var(--transition)
}
.content-area {
flex: 1;
overflow-y: auto;
padding: 12px;
padding-bottom: 80px;
position: relative;
-webkit-overflow-scrolling: touch
}
.list-item {
background: var(--surface);
border: 1px solid var(--border);
border-radius: var(--radius);
padding: 16px;
margin-bottom: 12px;
cursor: pointer;
transition: var(--transition);

overflow: hidden;
animation: itemIn .3s cubic-bezier(.4,0,.2,1) backwards
}
.list-item:nth-child(1) { animation-delay: .02s }
.list-item:nth-child(2) { animation-delay: .04s }
.list-item:nth-child(3) { animation-delay: .06s }
.list-item:nth-child(4) { animation-delay: .08s }
.list-item:nth-child(5) { animation-delay: .10s }
@keyframes itemIn {
from { opacity: 0; transform: translate3d(0,16px,0) }
to { opacity: 1; transform: translate3d(0,0,0) }
}
.list-item::before {
content: '';
position: absolute;
left: 0;
top: 0;
bottom: 0;
width: 4px;
background: var(--primary);
border-radius: var(--radius) 0 0 var(--radius);
transform: scaleY(0);
transition: transform .25s
}
.list-item:hover::before {
transform: scaleY(1)
}
.list-item:hover {

box-shadow: 0 8px 25px var(--shadow-primary)
}
.list-item .title {
font-size: 16px;
font-weight: 600;
margin-bottom: 8px;
color: var(--text)
}
.list-item .meta {
font-size: 12px;
color: var(--text-secondary)
}
.section-search {
display: none;
gap: 10px;
margin-bottom: 18px;
flex-wrap: wrap
}
.section-search.active {

animation: fadeInDown .3s ease
}
@keyframes fadeInDown {

to { opacity: 1; transform: translateY(0) }
}
.section-search input {

padding: 12px 16px;

border-radius: var(--radius-sm);
background: var(--bg);
color: var(--text);

}
.section-search input:focus {

.section-search button {

color: #fff;

border-radius: var(--radius-sm);

font-weight: 600;
transition: var(--transition-fast)
}
.section-search button:hover {
background: var(--primary-dark)

.section-search button:active {

}
.section-search .search-history {

gap: 6px;
flex-wrap: wrap;
margin-top: 4px;
width: 100%;
align-items: center
}
.section-search .search-history span {
font-size: 11px;
padding: 4px 10px;
background: var(--border-light);
color: var(--text-secondary);
border-radius: 12px;
cursor: pointer;
transition: var(--transition-fast)
}
.section-search .search-history span:hover {

}
.section-search .search-history .clear-history-btn {
font-size: 11px;

height: 88vh;

display: flex;
flex-direction: column;
transform: scale(0.92) translate3d(0,20px,0);

}

font-size: 17px;

background: none;

.img-modal {

.img-modal .img-watermark {

}
.img-modal .img-hint {

.loading {

}

}
.loading-bar {

}
.pager {

.toast {

}
function initMusicEvents() {
$('#musicFloatBtn').addEventListener('click', toggleMusicPanel);
$('#musicCloseBtn').addEventListener('click', function() { $('#musicPlayerPanel').classList.remove('show'); });
$('#musicPlayPauseBtn').addEventListener('click', function() {
if (musicState.isPlaying) {
var container = $('#musicIframeContainer');
if (container) container.style.display = 'none';
musicState.isPlaying = false;
this.textContent = '播放';
} else {
if (!musicState.iframeLoaded) {
if (musicState.songs.length > 0) playCurrentSong();
else if (musicState.playlistId) { loadMusicIframe(musicState.playlistId); musicState.isPlaying = true; this.textContent = '暂停'; }
} else {
var container = $('#musicIframeContainer');
if (container) container.style.display = 'block';
musicState.isPlaying = true;
this.textContent = '暂停';
}
}
});
$('#musicStopBtn').addEventListener('click', stopMusic);
$('#musicPrevBtn').addEventListener('click', prevSong);
$('#musicNextBtn').addEventListener('click', nextSong);
$('#musicVolume').addEventListener('input', function() { musicState.volume = parseFloat(this.value); });
var header = $('#musicPlayerHeader');
var panel = $('#musicPlayerPanel');
var isDragging = false;
var startX, startY, initialLeft, initialTop;
header.addEventListener('mousedown', function(e) {
isDragging = true;
startX = e.clientX;
startY = e.clientY;
initialLeft = panel.offsetLeft;
initialTop = panel.offsetTop;
document.addEventListener('mousemove', dragMove);
document.addEventListener('mouseup', dragEnd);
});
header.addEventListener('touchstart', function(e) {
isDragging = true;
startX = e.touches[0].clientX;
startY = e.touches[0].clientY;
initialLeft = panel.offsetLeft;
initialTop = panel.offsetTop;
document.addEventListener('touchmove', touchDragMove);
document.addEventListener('touchend', dragEnd);
});
function dragMove(e) {
if (!isDragging) return;
var dx = e.clientX - startX;
var dy = e.clientY - startY;
panel.style.left = (initialLeft + dx) + 'px';
panel.style.top = (initialTop + dy) + 'px';
panel.style.right = 'auto';
panel.style.bottom = 'auto';
}
function touchDragMove(e) {
if (!isDragging) return;
var dx = e.touches[0].clientX - startX;
var dy = e.touches[0].clientY - startY;
panel.style.left = (initialLeft + dx) + 'px';
panel.style.top = (initialTop + dy) + 'px';
panel.style.right = 'auto';
panel.style.bottom = 'auto';
}
function dragEnd() {
isDragging = false;
document.removeEventListener('mousemove', dragMove);
document.removeEventListener('touchmove', touchDragMove);
document.removeEventListener('mouseup', dragEnd);
document.removeEventListener('touchend', dragEnd);
}
}
function preloadOtherSections() {
if (!globalConfig.sections) return;
Object.keys(globalConfig.sections).forEach(function(s) {
if (s === currentSectionId) return;
queueRequest(function() {
return fetchWithTimeout((globalConfig.apiBase || 'https://api.tianbin.org/api/') + globalConfig.sections[s].api + "?_=" + Date.now()).then(function(r) { return r.json(); }).then(function(j) { sectionData[s] = j; }).catch(function() {});
}, priorityLevels.LOW).catch(function() {});
});
}
function initApp() {
queueRequest(function() {
return fetchWithTimeout(configApi + '?_=' + Date.now()).then(function(r) {
if (!r.ok) throw new Error("config load failed " + r.status);
return r.json();
}).then(function(j) {
globalConfig = j;
retryCount = 0;
document.title = j.siteName || '天彬TianBIN';
drawWatermark();
setInterval(drawWatermark, 150);
window.addEventListener('resize', drawWatermark);
bindAnnouncementEvents();
loadAnnouncement();
var params = new URLSearchParams(location.search);
var hash = location.hash.slice(1).split('/');
var initTab = params.get('tab') || hash[0];
currentSectionId = initTab && globalConfig.sections && globalConfig.sections[initTab] ? initTab : (j.homeId || Object.keys(j.sections || {})[0] || 'api');
renderNav();
switchTab(currentSectionId);
preloadOtherSections();
initMusicPlayer();
initMusicEvents();
if (hash.length >= 2 && hash[0] === currentSectionId && isSectionOpSearch(currentSectionId)) {
var anchor = hash[1];
var list = sectionData[currentSectionId] || [];
var found = list.find(function(it) { return String(it.id) === anchor; });
if (found) {
var idx = list.indexOf(found);
if (idx >= 0) setTimeout(function() { openItemCard(currentSectionId, idx, found.id); }, 400);
} else renderNotFound(currentSectionId, anchor);
}
}).catch(function() {
retryCount++;
var area = $('.content-area');
if (area) area.innerHTML = '<div class="loading">拉取加载数据中...<span class="loading-sub">(' + retryCount + '/3)</span><div class="loading-bar"></div></div>';
if (retryCount >= 3) forceReload();
else setTimeout(initApp, getRetryDelay());
});
});
}
function renderNav() {
var nav = $('.mobile-nav');
var navList = (globalConfig.bottomNav && globalConfig.bottomNav.length) ? globalConfig.bottomNav : Object.keys(globalConfig.sections || {}).map(function(id) {
var s = globalConfig.sections[id];
return { id: id, name: s.name || id, icon: s.icon || '•' };
});
nav.innerHTML = navList.map(function(s, i) {
return '<button data-id="' + s.id + '" data-index="' + i + '"><span class="nav-icon">' + s.icon + '</span><em>' + s.name + '</em>' + (s.badge ? '<i class="nav-badge" id="badge-' + s.id + '"></i>' : '');
}).join("");
$$('.mobile-nav button').forEach(function(btn) {
btn.addEventListener('click', function(e) {
e.preventDefault();
e.stopPropagation();
var id = this.getAttribute('data-id');
if (id && id !== currentSectionId && !isTabSwitching) switchTab(id);
});
});
updateNavState();
}
function updateNavState() {
$$('.mobile-nav button').forEach(function(btn) { btn.classList.toggle('active', btn.dataset.id === currentSectionId); });
var mh = $('.mobile-header');
if (mh) mh.textContent = ((globalConfig.bottomNav || []).find(function(s) { return s.id === currentSectionId; }) || {}).name || "";
}
function switchTab(tabId) {
if (isTabSwitching || tabId === currentSectionId) return;
isTabSwitching = true;
currentSectionId = tabId;
var ps = getSectionPageState(tabId);
ps.page = 1;
ps.filtered = null;
searchState.query = "";
updateNavState();
if (sectionData[tabId]) {
renderList(tabId);
isTabSwitching = false;
} else {
loadSectionData(tabId).then(function() { isTabSwitching = false; }).catch(function() { isTabSwitching = false; });
}
window.scrollTo(0, 0);
history.replaceState(null, null, "#" + tabId);
setTimeout(function() { isTabSwitching = false; }, 800);
}
function loadSectionData(tabId) {
var area = $('.content-area');
if (sectionData[tabId]) { renderList(tabId); return Promise.resolve(); }
area.innerHTML = '<div class="loading">拉取加载数据中...<span class="loading-sub">(' + retryCount + '/3)</span><div class="loading-bar"></div></div>';
return queueRequest(function() {
return fetchWithTimeout((globalConfig.apiBase || 'https://api.tianbin.org/api/') + globalConfig.sections[tabId].api + "?_=" + Date.now()).then(function(r) {
if (!r.ok) throw new Error("data load failed " + r.status);
return r.json();
}).then(function(j) {
sectionData[tabId] = j;
retryCount = 0;
renderList(tabId);
}).catch(function() {
retryCount++;
if (area) area.innerHTML = '<div class="loading">拉取加载数据中...<span class="loading-sub">(' + retryCount + '/3)</span><div class="loading-bar"></div></div>';
if (retryCount >= 3) forceReload();
else setTimeout(function() { loadSectionData(tabId); }, getRetryDelay());
});
});
}
function renderList(tabId) {
var list = (sectionData[tabId] || []).slice();
if (isSectionOpSearch(tabId)) {
list.sort(function(a, b) { return Number(b.id || 0) - Number(a.id || 0); });
} else {
var sortBy = getSectionSortBy(tabId), sortOrder = getSectionSortOrder(tabId);
if (sortBy === "date") {
list.sort(function(a, b) {
var da = new Date(a.date || 0), db = new Date(b.date || 0);
return sortOrder === "desc" ? db - da : da - db;
});
}
}
var ps = getSectionPageState(tabId);
ps.list = list.slice();
ps.page = 1;
ps.total = Math.max(1, Math.ceil(list.length / getSectionPerPage(tabId)));
renderListContent(tabId);
}
function renderListContent(tabId) {
var ps = getSectionPageState(tabId);
var list = ps.filtered || ps.list;
if (!list || list.length === 0) {
if (isSectionOpSearch(tabId) && searchState.query && /^\d+$/.test(searchState.query)) {
renderNotFound(tabId, searchState.query);
return;
}
$('.content-area').innerHTML = '<div class="loading" style="color:var(--text-tertiary)">暂无内容</div>';
return;
}
var perPage = getSectionPerPage(tabId);
ps.total = Math.max(1, Math.ceil(list.length / perPage));
if (ps.page > ps.total) ps.page = ps.total;
if (ps.page < 1) ps.page = 1;
var area = $('.content-area');
var html = '';
var isOp = isSectionOpSearch(tabId);
if (isSectionSearchable(tabId)) {
html += '<div class="section-search active">';
html += '<input id="secKey" placeholder="' + (isOp ? '输入数字ID查询' : '输入关键词查询') + '" value="' + (searchState.query || '') + '">';
html += '<button type="button" data-action="search">查询</button>';
if (searchState.query) {
html += '<button type="button" data-action="back-search" style="padding:12px 18px;background:var(--border-light);color:var(--text);border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;font-weight:600;">返回</button>';
}
html += '<div class="search-history" id="searchHistory"></div>';
html += '</div>';
}
var start = (ps.page - 1) * perPage, end = Math.min(start + perPage, list.length);
for (var i = start; i < end; i++) {
var item = list[i];
if (!item) continue;
html += '<div class="list-item" data-action="open" data-sid="' + tabId + '" data-idx="' + i + '" data-id="' + (item.id || '') + '">';
html += '<div class="title">' + (searchState.query ? highlightText(item.title || "", searchState.query) : (item.title || "")) + '</div>';
if (isOp) {
html += '<div class="meta">' + (item.date || '') + ' · ID:' + (item.id || "?") + ' · ' + (item.title || "") + '</div>';
} else {
html += '<div class="meta">' + (item.date || "") + ' · ' + (item.author || "") + '</div>';
}
html += '</div>';
}
html += '<div class="pager">';
html += '<button type="button" data-action="prev"' + (ps.page <= 1 ? ' disabled' : '') + '>上一页</button>';
html += '<span class="page-info">' + ps.page + ' / ' + ps.total + '</span>';
html += '<button type="button" data-action="next"' + (ps.page >= ps.total ? ' disabled' : '') + '>下一页</button>';
html += '</div>';
html += '<div class="sentinel" id="scrollSentinel"></div>';
area.innerHTML = html;
if (isSectionSearchable(tabId)) renderSearchHistory(tabId);
}
function highlightText(text, query) {
if (!query) return text;
var words = query.split(/\s+/).filter(function(w) { return w.length > 0; });
var result = text;
words.forEach(function(w) {
var regex = new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'),'gi');
result = result.replace(regex, '<mark>$&</mark>');
});
return result;
}
function doSearch() {
if (!isSectionSearchable(currentSectionId)) return;
var keyInput = $('#secKey');
if (!keyInput) return;
var k = keyInput.value.trim();
searchState.query = k;
var ps = getSectionPageState(currentSectionId);
if (!k) {
ps.filtered = null;
ps.page = 1;
renderListContent(currentSectionId);
return;
}
if (globalConfig.opSearch && globalConfig.opSearch.enabled) {
var res = opSearch(currentSectionId, k);
if (res && res.__notFound) return;
ps.filtered = res;
ps.page = 1;
renderListContent(currentSectionId);
if (/^\d+$/.test(k) && isSectionOpSearch(currentSectionId)) {
var l = sectionData[currentSectionId] || [];
var found = l.find(function(it) { return String(it.id) === k; });
if (found) { var idx = l.indexOf(found); if (idx >= 0) history.replaceState(null, null, "#" + currentSectionId + "/" + k); }
}
} else {
var mode = getSectionSearchMode(currentSectionId);
if (mode === "weighted") ps.filtered = weightedSearch(currentSectionId, k);
else ps.filtered = simpleSearch(currentSectionId, k);
ps.page = 1;
renderListContent(currentSectionId);
}
var histKey = 'searchHist_' + currentSectionId;
var hist = JSON.parse(sessionStorage.getItem(histKey) || '[]');
if (k && hist.indexOf(k) < 0) { hist.unshift(k); hist = hist.slice(0, 5); sessionStorage.setItem(histKey, JSON.stringify(hist)); }
}
function renderSearchHistory(tabId) {
var histKey = 'searchHist_' + tabId;
var hist = JSON.parse(sessionStorage.getItem(histKey) || '[]');
var sh = $('#searchHistory');
if (!sh) return;
var hhtml = '';
if (hist.length) {
hhtml += '<div class="search-history">';
hhtml += hist.map(function(h) { return '<span data-action="history" data-q="' + h.replace(/"/g, '&quot;') + '">' + h + '</span>'; }).join('');
hhtml += '<span class="clear-history-btn" data-action="clear-history">清空</span>';
hhtml += '</div>';
}
sh.innerHTML = hhtml;
if (searchState.query) { var sk = $('#secKey'); if (sk) sk.value = searchState.query; }
}
document.addEventListener('click', function(e) {
var target = e.target;
var actEl = target.closest('[data-action]');
if (!actEl) return;
var act = actEl.dataset.action;
switch (act) {
case 'open': openItemCard(actEl.dataset.sid, Number(actEl.dataset.idx), actEl.dataset.id); break;
case 'search': doSearch(); break;
case 'prev': var p1 = getSectionPageState(currentSectionId); if (p1.page > 1) { p1.page--; renderListContent(currentSectionId); window.scrollTo(0, 0); $('.content-area').scrollTop = 0; } break;
case 'next': var p2 = getSectionPageState(currentSectionId); if (p2.page < p2.total) { p2.page++; renderListContent(currentSectionId); window.scrollTo(0, 0); $('.content-area').scrollTop = 0; } break;
case 'open-img': openImageModal(actEl.dataset.src); break;
case 'open-html': openHtmlModal(actEl.dataset.sid, Number(actEl.dataset.idx), actEl.dataset.id); break;
case 'close-modal': closeModal('.modal'); break;
case 'close-html': closeModal('.html-modal-container'); break;
case 'reload': reloadHtmlModal(); break;
case 'history': $('#secKey').value = actEl.dataset.q; doSearch(); break;
case 'back-search': searchState.query = ""; var p3 = getSectionPageState(currentSectionId); p3.filtered = null; p3.page = 1; renderListContent(currentSectionId); break;
case 'clear-history': sessionStorage.removeItem('searchHist_' + currentSectionId); renderSearchHistory(currentSectionId); break;
case 'copy-link': var url = actEl.dataset.url || ''; if (url) { navigator.clipboard.writeText(url).then(function() { var toast = $('#toast'); if (toast) { toast.textContent = '链接已复制'; toast.classList.add('toast-success', 'show'); setTimeout(function() { toast.classList.remove('show', 'toast-success'); }, 2000); } }).catch(function() { var ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch(err) {} document.body.removeChild(ta); }); } break;
}
});
document.addEventListener('DOMContentLoaded', function() {
var m = $('.modal');
if (m) m.addEventListener('click', function(e) { if (e.target === e.currentTarget) closeModal('.modal'); });
var hm = $('.html-modal-container');
if (hm) hm.addEventListener('click', function(e) { if (e.target === e.currentTarget) closeModal('.html-modal-container'); });
var im = $('.img-modal');
if (im) im.addEventListener('click', function(e) { if (e.target.tagName === 'IMG' || e.target.classList.contains('img-container') || e.target.classList.contains('img-watermark') || e.target === im) closeModal('.img-modal'); });
setTimeout(function() { if (!isAnnounceAgreed) initAnnounceLock(); }, 88888);
});
document.addEventListener('keydown', function(e) {
if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { $('#secKey').focus(); e.preventDefault(); }
if (e.key === 'Escape') {
if (isAnnounceAgreed === false && $('#announcementModal') && $('#announcementModal').classList.contains('active')) { initAnnounceLock(); return; }
$$('.modal.active,.html-modal-container.active,.img-modal.active').forEach(function(el) {
if (el.classList.contains('modal')) closeModal('.modal');
else if (el.classList.contains('html-modal-container')) closeModal('.html-modal-container');
else closeModal('.img-modal');
});
}
});
initApp();
})();
</script>
</body>
</html>
