<style>
:root {
--bg: #ffffff;
--surface: #f8fafc;
--surface-hover: #eff6ff;
--primary: #4a9eff;
--primary-dark: #3b82f6;
--text: #1e293b;
--text-secondary: #64748b;
--text-tertiary: #94a3b8;
--text-disabled: #cbd5e1;
--border: #e2e8f0;

--overlay-modal: rgba(0,0,0,0.55);

--z-music-panel: 950;
}
*,::before,::after {
box-sizing: border-box;
margin: 0;
padding: 0;
-webkit-tap-highlight-color: rgba(0,0,0,0)!important;
-webkit-touch-callout: none!important;
user-select: none!important;
outline: none!important
}
body {
font-family: var(--font);
background: var(--bg);
color: var(--text);

overflow-x: hidden;
font-size: 14px;

}
img {
max-width: 100%;

pointer-events: none;
-webkit-user-drag: none
}
#app {
display: flex;
flex-direction: column;
min-height: 100vh;

}
#watermark-canvas {

z-index: var(--z-watermark)
}
.mobile-header {
display: block;
background: var(--surface);
color: var(--text);
padding: 15px;
text-align: center;
font-size: 18px;
font-weight: 700;

transition: var(--transition)
}
.content-area {

overflow-y: auto;
padding: 12px;
padding-bottom: 80px;
position: relative;
-webkit-overflow-scrolling: touch
}
.list-item {

border-radius: var(--radius);
padding: 16px;
margin-bottom: 12px;

transition: var(--transition);

overflow: hidden;

}
.list-item:nth-child(1) { animation-delay: .02s }
.list-item:nth-child(2) { animation-delay: .04s }
.list-item:nth-child(3) { animation-delay: .06s }
.list-item:nth-child(4) { animation-delay: .08s }
.list-item:nth-child(5) { animation-delay: .10s }

from { opacity: 0; transform: translate3d(0,16px,0) }
to { opacity: 1; transform: translate3d(0,0,0) }
}
.list-item::before {
content: '';
position: absolute;
left: 0;
top: 0;
bottom: 0;
width: 4px;

border-radius: var(--radius) 0 0 var(--radius);

}
.list-item:hover::before { transform: scaleY(1) }
.list-item:hover {

.list-item .title {

}
.list-item .meta {

}
.section-search {

}
.section-search.active {

}
.section-search input {

padding: 12px 16px;
border: 1.5px solid var(--border);

}
.section-search input:focus {

.section-search button {

}
.section-search button:hover { background: var(--primary-dark) }
.section-search button:active { transform: scale(0.95) }

align-items: center
}
.section-search .search-history span {

}
.section-search .search-history span:hover {

}
.section-search .search-history .clear-history-btn {

}

right: 0;

flex-direction: column;

white-space: nowrap;

text-align: center;

.mobile-nav button .nav-badge {

.modal {

.modal-header {

background: rgba(0,0,0,0.65);

opacity: 0;
visibility: hidden;

}

background: var(--bg);

max-width: 460px;
height: 88vh;
border-radius: var(--radius-lg);
display: flex;
flex-direction: column;
transform: scale(0.92) translate3d(0,20px,0);

overflow: hidden;
border: 1px solid var(--border);

}
.html-modal.active .html-modal-box { transform: scale(1) translate3d(0,0,0) }
.html-modal-header {

display: flex;
justify-content: space-between;
align-items: center;
flex-shrink: 0
}
.html-modal-header h3 { font-size: 17px; color: var(--text); font-weight: 600 }
.html-modal-close {
background: none;
border: none;
font-size: 26px;
cursor: pointer;
color: var(--text-tertiary);
line-height: 1;

.html-reload-btn {

.show-html-btn {

border-radius: var(--radius-sm);
font-size: 15px;

}

.img-modal {
position: fixed;
inset: 0;
background: rgba(0,0,0,0.98);
z-index: var(--z-img);
display: flex;
align-items: center;
justify-content: center;
opacity: 0;

}

justify-content: center

.img-modal .img-container img {

.img-modal .img-watermark {

.img-modal .img-watermark span {

@keyframes imgWmCycle {

50% { color: #3b82f6 }
75% { color: #eab308 }

}
.img-modal .img-hint {

bottom: 16px;

.loading {

color: var(--text-secondary);

}
.loading-sub {

font-weight: 500
}
.loading-bar {

background: var(--border);

.loading-bar::after {

}
.pager {
display: flex;
justify-content: center;
align-items: center;
gap: 12px;
padding: 20px;
white-space: nowrap
}
.pager button {
padding: 12px 24px;
border: none;
background: var(--primary);
color: #fff;
border-radius: var(--radius-sm);
cursor: pointer;
font-size: 14px;
font-weight: 600;
transition: var(--transition-fast)
}
.pager button:hover {
background: var(--primary-dark);
box-shadow: 0 4px 12px var(--shadow-primary)
}
.pager button:disabled {

.pager .page-info {

}
.toast {

var configData={};

var requestQueue=[];

var watermarkAngle=-Math.PI/6;

iframeMode:false,
currentId:null
};

function qs(selector,parent){return(selector||document).querySelector(selector)}
function qsa(selector,parent){return[].slice.call((selector||document).querySelectorAll(selector))}
function getRetryDelay(){if(retryCount<3)return(retryCount+1)*1000;return 3000}
function clearAndReload(){
try{localStorage.clear();sessionStorage.clear()}catch(e){}
setTimeout(function(){window.location.reload(true)},500)
}
function fetchWithTimeout(url,timeout){
return Promise.race([fetch(url,{cache:"no-store"}),new Promise(function(resolve,reject){setTimeout(function(){reject(new Error('timeout'))},timeout||getRetryDelay())})])
}
function queueRequest(fn,priority){
return new Promise(function(resolve,reject){
requestQueue.push({fn:fn,resolve:resolve,reject:reject,priority:priority||priorityLevels.NORMAL});
requestQueue.sort(function(a,b){return a.priority-b.priority});
processQueue()
})
}
function processQueue(){
var limit=(configData.behavior&&configData.behavior.concurrencyLimit)||3;
while(activeRequests<limit&&requestQueue.length>0){
var req=requestQueue.shift();
activeRequests++;
req.fn().then(req.resolve).catch(req.reject).finally(function(){activeRequests--;processQueue()})
}
}
function getSectionConfig(sid){return(configData.sections&&configData.sections[sid])||{}}
function getPerPage(sid){return getSectionConfig(sid).perPage||10}
function isSearchable(sid){return!!getSectionConfig(sid).searchable}
function getSortBy(sid){return getSectionConfig(sid).sortBy||"date"}
function getSortOrder(sid){return getSectionConfig(sid).sortOrder||"desc"}
function getSearchFields(sid){return getSectionConfig(sid).searchFields||["title"]}
function getSearchMode(sid){return getSectionConfig(sid).searchMode||"simple"}
function isOpSearch(sid){return!!(configData.opSearch&&configData.opSearch.enabled&&getSectionConfig(sid).opEnabled)}
function getSectionPageState(sid){
if(!sectionState[sid])sectionState[sid]={page:1,total:1,list:[],filtered:null};
return sectionState[sid]
}
function buildSearchIndex(sid){
var list=sectionsData[sid]||[];
var fields=getSearchFields(sid);
window._searchIndex=window._searchIndex||{};
window._searchIndex[sid]=list.map(function(item,idx){
var text="";
fields.forEach(function(f){text+=(item[f]||"")+" "});
return{idx:idx,text:text.toLowerCase(),item:item}
})
}
function weightedSearch(sid,query){
if(!window._searchIndex||!window._searchIndex[sid])buildSearchIndex(sid);
var q=query.toLowerCase();
var fields=getSearchFields(sid);
return window._searchIndex[sid].map(function(entry){
var score=0;
var item=entry.item;
fields.forEach(function(f,i){
var val=(item[f]||"").toLowerCase();
if(val===q)score+=100-i*10;
else if(val.indexOf(q)>=0)score+=50-i*5;
var words=q.split(/\s+/);
words.forEach(function(w){if(val.indexOf(w)>=0)score+=10-i})
});
return{entry:entry,score:score}
}).filter(function(r){return r.score>0}).sort(function(a,b){return b.score-a.score}).map(function(r){return r.entry.item})
}
function simpleSearch(sid,query){
var fields=getSearchFields(sid);
var q=query.toLowerCase();
return(sectionsData[sid]||[]).filter(function(it){return fields.some(function(f){return(it[f]||"").toLowerCase().indexOf(q)>=0})})
}
function opSearch(sid,query){
if(!isOpSearch(sid))return simpleSearch(sid,query);
if(configData.opSearch.numericOnly&&/^\d+$/.test(query)){
var list=sectionsData[sid]||[];
var exact=list.filter(function(it){return String(it.id)===query});
if(exact.length>0){if(configData.opSearch.cardOnFound)openCard(sid,exact[0]);return exact}
renderNotFound(sid,query);return{__notFound:true}
}
var results=simpleSearch(sid,query);
if(results.length===0){renderNotFound(sid,query);return{__notFound:true}}
if(results.length===1&&configData.opSearch.cardOnFound)openCard(sid,results[0]);
return results
}
function openCard(sid,item){
var list=sectionsData[sid]||[];
var realIdx=list.findIndex(function(it){return it.id===item.id});
if(realIdx>=0)showDetailModal(sid,realIdx,item.id)
}
function highlightText(text,query){
if(!query)return text;
var words=query.split(/\s+/).filter(function(w){return w.length>0});
var result=text;
words.forEach(function(w){
var regex=new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
result=result.replace(regex,'<mark>$&</mark>')
});
return result
}
function drawWatermark(){
var canvas=qs('#watermark-canvas');
if(!canvas){canvas=document.createElement('canvas');canvas.id='watermark-canvas';canvas.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:2147483647;';document.body.appendChild(canvas)}
var ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.font='14px -apple-system,sans-serif';
ctx.globalAlpha=0.5;
var hue=(Date.now()*watermarkAlpha)%360;
ctx.fillStyle='hsla('+hue+',85%,55%,0.5)';
var text=(configData.security&&configData.security.watermarkText)||'起点小说《天彬》';
for(var i=0;i<30;i++){ctx.save();ctx.translate(Math.random()*canvas.width,Math.random()*canvas.height);ctx.rotate(watermarkAngle);ctx.fillText(text,0,0);ctx.restore()}
ctx.globalAlpha=1
}

html+='<a href="https://www.TianBIN.org" target="_blank" rel="noopener" style="padding:10px 22px;border-radius:10px;background:var(--primary);color:#fff;font-weight:600;text-decoration:none;display:inline-block;">登记</a>';
html+='</div>';
area.innerHTML=html
}
function enableAnnounceButton(){
var btn=qs('#announcementBtn');
var progressBar=qs('#announceProgressBar');
if(!btn)return;
if(announceTimeElapsed>=announceRequiredTime&&announceScrollPercent>50){
btn.disabled=false;
btn.classList.add('enabled');
btn.textContent='我阅读并同意以上条款内容';
progressBar.style.width='100%'
}else{
btn.disabled=true;
btn.classList.remove('enabled');
var remaining=Math.ceil((announceRequiredTime-announceTimeElapsed)/1000);
if(remaining>0)btn.textContent='请阅读公告内容 ('+remaining+'秒)';
else btn.textContent='请滚动阅读全部内容'
var progress=Math.min(100,(announceTimeElapsed/announceRequiredTime)*100);
progressBar.style.width=progress+'%'
}
}
function startAnnounceTimer(){
if(announceTimer)clearInterval(announceTimer);
announceTimeElapsed=0;
announceScrollPercent=0;
announceTimer=setInterval(function(){
announceTimeElapsed+=100;
enableAnnounceButton()
},100)
}
function checkAnnounceScroll(){
var body=qs('#announcementBody');
if(!body)return;
var scrollTop=body.scrollTop;
var scrollHeight=body.scrollHeight-body.clientHeight;
if(scrollHeight>0){
announceScrollPercent=(scrollTop/scrollHeight)*100;
if(announceScrollPercent>100)announceScrollPercent=100;
enableAnnounceButton()
}else{
announceScrollPercent=100;
enableAnnounceButton()
}
}
function closeAnnouncement(){
announceAgreed=true;
try{localStorage.setItem('announce_ver','agreed_'+Date.now())}catch(e){}
var modal=qs('#announcementModal');
var overlay=qs('#announcementOverlay');

if(modal){modal.style.backdropFilter='none';modal.style.webkitBackdropFilter='none';modal.style.pointerEvents='none'}

if(ca){ca.style.overflow='';ca.style.filter='none';ca.style.opacity='';ca.style.pointerEvents='auto'}

}
function initAnnouncement(){
if(announceAgreed)return;
var au=_getAnnounceUrl();
fetch(au,{cache:"no-store",headers:{"Cache-Control":"no-cache, no-store, must-revalidate","Pragma":"no-cache"}}).then(function(r){return r.json()}).then(function(data){
if(!data.announcement||!data.announcement.enabled){closeAnnouncement();return}
var ann=data.announcement;
var tEl=qs('#announcementTitle');
var bEl=qs('#announcementBody');
if(tEl)tEl.textContent=ann.title||'公告';
if(bEl)bEl.innerHTML=ann.content||'请前往 www.TianBIN.org 登记！！！';

var modal=qs('#announcementModal');
var overlay=qs('#announcementOverlay');
if(modal)modal.classList.add('active');
if(overlay)overlay.classList.add('show');
startAnnounceTimer();
setTimeout(function(){checkAnnounceScroll()},500)
}).catch(function(){closeAnnouncement()})
}
function blockBackgroundInteraction(e){

}

if(bodyEl){bodyEl.addEventListener('scroll',checkAnnounceScroll);bodyEl.addEventListener('touchmove',checkAnnounceScroll)}
}
function preloadOtherSections(){
if(!configData.sections)return;
Object.keys(configData.sections).forEach(function(s){
if(s===currentSection)return;
queueRequest(function(){
return fetchWithTimeout(_getApiBase()+configData.sections[s].api+'?_='+Date.now()).then(function(r){return r.json()}).then(function(j){sectionsData[s]=j}).catch(function(){})
},priorityLevels.LOW).catch(function(){})
})
}
function loadConfig(){
return queueRequest(function(){
return fetchWithTimeout(_getSiteConfigUrl()).then(function(r){
if(!r.ok)throw new Error("config load failed "+r.status);
return r.json()
}).then(function(j){
configData=j;
retryCount=0;
document.title=j.siteName||'天彬TianBIN';
drawWatermark();
setInterval(drawWatermark,150);
window.addEventListener('resize',drawWatermark);
setupAnnounceBlocking();
initAnnouncement();
var params=new URLSearchParams(location.search);
var hash=location.hash.slice(1).split('/');
var initTab=params.get('tab')||hash[0];
currentSection=initTab&&configData.sections&&configData.sections[initTab]?initTab:j.homeId||Object.keys(j.sections||{})[0]||'api';
buildNav();
updateHeader();
loadSectionData(currentSection,true).then(function(){
if(hash.length>=2&&hash[0]===currentSection&&isOpSearch(currentSection)){
var anchor=hash[1];
var list=sectionsData[currentSection]||[];
var found=list.find(function(it){return String(it.id)===anchor});
if(found){var idx=list.indexOf(found);if(idx>=0)setTimeout(function(){showDetailModal(currentSection,idx,found.id)},400)}else renderNotFound(currentSection,anchor)
}
});
preloadOtherSections()
}).catch(function(){
retryCount++;
var area=qs('.content-area');
if(area)area.innerHTML='<div class="loading">拉取加载数据中...<span class="loading-sub">('+retryCount+'/3)</span><div class="loading-bar"></div></div>';
if(retryCount>=3)clearAndReload();
else setTimeout(loadConfig,getRetryDelay())
})
})
}
function buildNav(){
var nav=qs('.mobile-nav');
var navList=(configData.bottomNav&&configData.bottomNav.length)?configData.bottomNav:Object.keys(configData.sections||{}).map(function(id){
var s=configData.sections[id];
return{id:id,name:s.name||id,icon:s.icon||'•'}
});
nav.innerHTML=navList.map(function(s,i){
return'<button data-id="'+s.id+'" data-index="'+i+'"><span class="nav-icon">'+s.icon+'</span><em>'+s.name+'</em>'+(s.badge?'<i class="nav-badge" id="badge-'+s.id+'"></i>':'')
}).join("");
qsa('.mobile-nav button').forEach(function(btn){
btn.addEventListener('click',function(e){
e.preventDefault();
e.stopPropagation();
var id=this.getAttribute('data-id');
if(id&&id!==currentSection&&!isLoading)switchSection(id)
})
})
}
function updateHeader(){
var mh=qs('.mobile-header');
if(mh)mh.textContent=((configData.bottomNav||[]).find(function(s){return s.id===currentSection}))?((configData.bottomNav||[]).find(function(s){return s.id===currentSection})).name:''
}
function switchSection(sid){
if(isLoading||sid===currentSection)return;
isLoading=true;
currentSection=sid;
var ps=getSectionPageState(sid);
ps.page=1;
ps.filtered=null;
searchState.query="";
updateHeader();
updateNavActive();
if(sectionsData[sid]){renderList(sid);isLoading=false}else{loadSectionData(sid,true)}
window.scrollTo(0,0);
history.replaceState(null,null,"#"+sid);
setTimeout(function(){isLoading=false},800)
}
function updateNavActive(){
qsa('.mobile-nav button').forEach(function(btn){btn.classList.toggle('active',btn.dataset.id===currentSection)})
}
function loadSectionData(sid,showLoading){
return queueRequest(function(){
if(showLoading){
var area=qs('.content-area');
if(area)area.innerHTML='<div class="loading">拉取加载数据中...<span class="loading-sub">('+retryCount+'/3)</span><div class="loading-bar"></div></div>'
}
return fetchWithTimeout(_getApiBase()+configData.sections[sid].api+'?_='+Date.now()).then(function(r){
if(!r.ok)throw new Error("data load failed "+r.status);
return r.json()
}).then(function(j){
var changed=JSON.stringify(sectionsData[sid])!==JSON.stringify(j);
sectionsData[sid]=j;
retryCount=0;
if(showLoading!==false)renderList(sid);
else if(changed&&sid===currentSection)renderList(sid)
}).catch(function(){
retryCount++;
if(showLoading!==false){
var area=qs('.content-area');
if(area)area.innerHTML='<div class="loading">拉取加载数据中...<span class="loading-sub">('+retryCount+'/3)</span><div class="loading-bar"></div></div>';
if(retryCount>=3)clearAndReload();
else setTimeout(function(){loadSectionData(sid,true)},getRetryDelay())
}
})
})
}
function sortAndPaginate(sid){
var list=(sectionsData[sid]||[]).slice();
if(isOpSearch(sid)){list.sort(function(a,b){return Number(b.id||0)-Number(a.id||0)})}
else{var sortBy=getSortBy(sid),sortOrder=getSortOrder(sid);if(sortBy==="date"){list.sort(function(a,b){var da=new Date(a.date||0),db=new Date(b.date||0);return sortOrder==="desc"?db-da:da-db})}}
var ps=getSectionPageState(sid);
ps.list=list.slice();
ps.page=1;
ps.total=Math.max(1,Math.ceil(list.length/getPerPage(sid)));
renderList(sid)
}
function renderList(sid){
var ps=getSectionPageState(sid);
var list=ps.filtered||ps.list;
if(!list||list.length===0){
if(isOpSearch(sid)&&searchState.query&&/^\d+$/.test(searchState.query)){renderNotFound(sid,searchState.query);return}
qs('.content-area').innerHTML='<div class="loading" style="color:var(--text-tertiary)">暂无内容</div>';
return
}
var perPage=getPerPage(sid);
ps.total=Math.max(1,Math.ceil(list.length/perPage));
if(ps.page>ps.total)ps.page=ps.total;
if(ps.page<1)ps.page=1;
var area=qs('.content-area');
var html='';
var isOp=isOpSearch(sid);
if(isSearchable(sid)){
html+='<div class="section-search active">';
html+='<input id="secKey" placeholder="'+(isOp?'输入数字ID查询':'输入关键词查询')+'" value="'+(searchState.query||'')+'">';
html+='<button type="button" data-action="search">查询</button>';
if(searchState.query){html+='<button type="button" data-action="back-search" style="padding:12px 18px;background:var(--border-light);color:var(--text);border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;font-weight:600;">返回</button>'}
html+='<div class="search-history" id="searchHistory"></div>';
html+='</div>'
}
var start=(ps.page-1)*perPage,end=Math.min(start+perPage,list.length);
for(var i=start;i<end;i++){
var item=list[i];
if(!item)continue;
html+='<div class="list-item" data-action="open" data-sid="'+sid+'" data-idx="'+i+'" data-id="'+(item.id||'')+'">';
html+='<div class="title">'+(searchState.query?highlightText(item.title||"",searchState.query):(item.title||""))+'</div>';
if(isOp){html+='<div class="meta">'+(item.date||'')+' · ID:'+(item.id||"?")+' · '+(item.title||"")+'</div>'}
else{html+='<div class="meta">'+(item.date||"")+' · '+(item.author||"")+'</div>'}
html+='</div>'
}
html+='<div class="pager">';
html+='<button type="button" data-action="prev"'+(ps.page<=1?' disabled':'')+'>上一页</button>';
html+='<span class="page-info">'+ps.page+' / '+ps.total+'</span>';
html+='<button type="button" data-action="next"'+(ps.page>=ps.total?' disabled':'')+'>下一页</button>';
html+='</div>';
html+='<div class="sentinel" id="scrollSentinel"></div>';
area.innerHTML=html;
if(isSearchable(sid))renderSearchHistory(sid)
}
function renderSearchHistory(sid){
var key='searchHist_'+sid;
var hist=JSON.parse(sessionStorage.getItem(key)||'[]');
var sh=qs('#searchHistory');
if(!sh)return;
var html='';
if(hist.length){
html+='<div class="search-history">';
html+=hist.map(function(h){return'<span data-action="history" data-q="'+h.replace(/"/g,'&quot;')+'">'+h+'</span>'}).join('');
html+='<span class="clear-history-btn" data-action="clear-history">清空</span>';
html+='</div>'
}
sh.innerHTML=html;
if(searchState.query){var sk=qs('#secKey');if(sk)sk.value=searchState.query}
}
function handleSearch(){
if(!isSearchable(currentSection))return;
var k=qs('#secKey').value.trim();
searchState.query=k;
var ps=getSectionPageState(currentSection);
if(!k){ps.filtered=null;ps.page=1;renderList(currentSection);return}
if(configData.opSearch&&configData.opSearch.enabled){
var res=opSearch(currentSection,k);
if(res&&res.__notFound)return;
ps.filtered=res;ps.page=1;renderList(currentSection);
if(/^\d+$/.test(k)&&isOpSearch(currentSection)){
var list=sectionsData[currentSection]||[];
var found=list.find(function(it){return String(it.id)===k});
if(found){var idx=list.indexOf(found);if(idx>=0)history.replaceState(null,null,"#"+currentSection+"/"+k)}
}
return
}else{
var mode=getSearchMode(currentSection);
if(mode==="weighted")ps.filtered=weightedSearch(currentSection,k);
else ps.filtered=simpleSearch(currentSection,k);
ps.page=1;renderList(currentSection)
}
var key='searchHist_'+currentSection;
var hist=JSON.parse(sessionStorage.getItem(key)||'[]');
if(k&&hist.indexOf(k)<0){hist.unshift(k);hist=hist.slice(0,5);sessionStorage.setItem(key,JSON.stringify(hist))}
}
function showDetailModal(sid,idx,realId){
var list=sectionsData[sid]||[];
var item;
if(realId!==undefined&&isOpSearch(sid)){item=list.find(function(it){return String(it.id)===String(realId)});idx=list.indexOf(item)}else{item=list[idx]}
if(!item)return;
var modal=qs('.modal');
var body=qs('.modal-body');
var html='<div class="text">'+(item.content||"").replace(/\n/g,"<br>").replace(/\t([^\n]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')+'</div>';
if(item.imgs&&item.imgs.length){html+='<div class="img-grid">'+item.imgs.slice(0,9).map(function(u){return'<img src="'+u+'" data-action="open-img" data-src="'+u+'">'}).join("")+'</div>'}
if(item.html){html+='<button type="button" class="show-html-btn" data-action="open-html" data-sid="'+sid+'" data-idx="'+idx+'" data-id="'+(item.id||'')+'">立即了解…</button>'}
body.innerHTML=html;
qs('.modal-header h3').textContent=item.title||"";
var copyBtn=qs('.copy-link-btn');
if(copyBtn){if(isOpSearch(sid)&&item.id){copyBtn.classList.add('show');copyBtn.dataset.url=location.origin+location.pathname+'#'+sid+'/'+item.id}else{copyBtn.classList.remove('show');copyBtn.dataset.url=''}}
modal.classList.add("active")
}
function showHtmlModal(sid,idx,realId){
var list=sectionsData[sid]||[];
var item;
if(realId!==undefined&&isOpSearch(sid)){item=list.find(function(it){return String(it.id)===String(realId)});idx=list.indexOf(item)}else{item=list[idx]}
if(!item)return;
var modal=qs('.html-modal');
var body=qs('.html-modal-body');
qs('.html-modal-header h3').textContent=item.title||"详细内容";
var raw=(item.html||"").replace(/¥/g,'"');
var ts='?_='+Date.now();
var contentHtml='';
if(/<iframe/i.test(raw)){contentHtml=raw.replace(/<iframe/i,'<iframe id="subIframe"').replace(/<\/iframe>/i,'</iframe>');if(contentHtml.indexOf('src="')>=0)contentHtml=contentHtml.replace(/(src="[^"]*)"/,'$1'+ts+'"')}else{contentHtml='<iframe id="subIframe" srcdoc="'+raw.replace(/"/g,'&quot;')+'" sandbox="allow-same-origin allow-scripts allow-popups allow-forms" style="width:100%;height:100%;border:none;display:block;"></iframe>'}
contentHtml+='<button type="button" class="html-reload-btn" data-action="reload">↻</button>';
body.innerHTML=contentHtml;
var iframe=qs('#subIframe');
if(iframe)iframe.onload=function(){};
modal.classList.add("active")
}
function openImage(src){
var im=qs('.img-modal');
if(!im)return;
var img=im.querySelector('img');
if(img)img.src=src;
var wm=im.querySelector('.img-watermark span');
if(wm)wm.textContent=(configData.security&&configData.security.watermarkText)||'天彬TianBIN';
im.classList.add('active');
document.body.style.overflow='hidden'
}
function closeModal(selector){
var el=qs(selector);
if(el)el.classList.remove('active');
if(selector.indexOf('img-modal')>=0)document.body.style.overflow='';
if(selector.indexOf('html-modal')>=0){var b=qs('.html-modal-body');if(b)b.innerHTML=''}
}
function reloadIframe(){
var iframe=qs('#subIframe');
if(!iframe)return;
if(iframe.hasAttribute('srcdoc')){iframe.setAttribute('srcdoc',iframe.getAttribute('srcdoc'))}else{var src=iframe.src;iframe.src='';setTimeout(function(){iframe.src=src+(src.indexOf('?')>=0?'&':'?')+'_='+Date.now()},50)}
}
function copyLink(url){
if(!url)return;
navigator.clipboard.writeText(url).then(function(){
var toast=qs('#toast');
if(toast){toast.textContent='链接已复制';toast.classList.add('toast-success','show');setTimeout(function(){toast.classList.remove('show','toast-success')},2000)}
}).catch(function(){
var ta=document.createElement('textarea');
ta.value=url;document.body.appendChild(ta);ta.select();
try{document.execCommand('copy')}catch(err){}
document.body.removeChild(ta)
})
}

function initMusicPlayer(){
var floatBtn=qs('#musicFloatBtn');
var panel=qs('#musicPanel');
var closeBtn=qs('#musicPanelClose');
if(floatBtn){floatBtn.addEventListener('click',function(){panel.classList.toggle('active');if(panel.classList.contains('active'))loadPlaylist()})}
if(closeBtn){closeBtn.addEventListener('click',function(){panel.classList.remove('active')})}
qs('#musicPlayBtn').addEventListener('click',togglePlay);
qs('#musicPrevBtn').addEventListener('click',playPrev);
qs('#musicNextBtn').addEventListener('click',playNext);
qs('#musicStopBtn').addEventListener('click',stopMusic);
qs('#musicVolume').addEventListener('input',function(e){setVolume(e.target.value/100)});
qs('#musicProgressBar').addEventListener('click',function(e){seekMusic(e)});
makeDraggable(qs('#musicPanelHeader'),panel);
checkMusicConfig()
}
function checkMusicConfig(){
if(configData.music&&configData.music.enabled){qs('#musicFloatBtn').classList.add('show');if(configData.music.playlistId)musicPlayer.currentId=configData.music.playlistId}else{qs('#musicFloatBtn').classList.remove('show')}
}
function loadPlaylist(){
if(musicPlayer.playlist.length>0)return;
if(!musicPlayer.currentId){qs('#musicName').textContent='未配置歌单';return}
qs('#musicName').textContent='加载中...';
var iframeContainer=qs('#musicIframeContainer');
var iframeHtml='<iframe src="//music.163.com/outchain/player?type=0&id='+musicPlayer.currentId+'&auto=0" width="100%" height="90" frameborder="0"></iframe>';
iframeContainer.innerHTML=iframeHtml;
iframeContainer.classList.add('expanded');
musicPlayer.iframeMode=true;
fetchPlaylistFromAPI(musicPlayer.currentId)
}
function fetchPlaylistFromAPI(id){
var apiUrl=_getApiBase()+'music/playlist/'+id+'?_='+Date.now();
fetchWithTimeout(apiUrl,3000).then(function(r){return r.json()}).then(function(data){
if(data.songs&&data.songs.length){musicPlayer.playlist=data.songs;musicPlayer.currentIndex=0;initAudioPlayer()}
}).catch(function(){musicPlayer.iframeMode=true;qs('#musicName').textContent='网易云歌单 '+id;qs('#musicArtist').textContent='点击播放控制'})
}
function initAudioPlayer(){
if(!musicPlayer.audio){musicPlayer.audio=new Audio();musicPlayer.audio.volume=musicPlayer.volume;musicPlayer.audio.addEventListener('timeupdate',updateProgress);musicPlayer.audio.addEventListener('ended',playNext);musicPlayer.audio.addEventListener('loadedmetadata',function(){qs('#musicDuration').textContent=formatTime(musicPlayer.audio.duration)})}
if(musicPlayer.playlist.length>0){var song=musicPlayer.playlist[musicPlayer.currentIndex];if(song.url){musicPlayer.audio.src=song.url;qs('#musicName').textContent=song.name;qs('#musicArtist').textContent=song.artist||'未知艺术家'}}}
function togglePlay(){
if(musicPlayer.iframeMode){qs('#musicName').textContent='请使用iframe播放器控制';return}
if(!musicPlayer.audio||!musicPlayer.audio.src){if(musicPlayer.playlist.length>0)initAudioPlayer();else return}
if(musicPlayer.playing){musicPlayer.audio.pause();musicPlayer.playing=false;qs('#musicPlayBtn').textContent='▶'}else{musicPlayer.audio.play();musicPlayer.playing=true;qs('#musicPlayBtn').textContent='⏸'}
}
function playPrev(){
if(musicPlayer.iframeMode)return;
if(musicPlayer.playlist.length===0)return;
musicPlayer.currentIndex=(musicPlayer.currentIndex-1+musicPlayer.playlist.length)%musicPlayer.playlist.length;
initAudioPlayer();
if(musicPlayer.playing)musicPlayer.audio.play()
}
function playNext(){
if(musicPlayer.iframeMode)return;
if(musicPlayer.playlist.length===0)return;
musicPlayer.currentIndex=(musicPlayer.currentIndex+1)%musicPlayer.playlist.length;
initAudioPlayer();
if(musicPlayer.playing)musicPlayer.audio.play()
}
function stopMusic(){
if(musicPlayer.iframeMode)return;
if(musicPlayer.audio){musicPlayer.audio.pause();musicPlayer.audio.currentTime=0;musicPlayer.playing=false;qs('#musicPlayBtn').textContent='▶'}
}
function setVolume(v){
musicPlayer.volume=v;
if(musicPlayer.audio)musicPlayer.audio.volume=v;
qs('#musicVolume').value=v*100
}
function seekMusic(e){
if(musicPlayer.iframeMode)return;
if(!musicPlayer.audio)return;
var bar=qs('#musicProgressBar');
var rect=bar.getBoundingClientRect();
var percent=(e.clientX-rect.left)/rect.width;
musicPlayer.audio.currentTime=percent*musicPlayer.audio.duration
}
function updateProgress(){
if(!musicPlayer.audio)return;
var current=musicPlayer.audio.currentTime;
var duration=musicPlayer.audio.duration;
qs('#musicCurrentTime').textContent=formatTime(current);
qs('#musicProgressFill').style.width=((current/duration)*100)+'%'
}
function formatTime(seconds){
if(isNaN(seconds))return"0:00";
var m=Math.floor(seconds/60);
var s=Math.floor(seconds%60);
return m+':'+(s<10?'0':'')+s
}
function makeDraggable(header,panel){
var pos1=0,pos2=0,pos3=0,pos4=0;
header.onmousedown=function(e){e.preventDefault();pos3=e.clientX;pos4=e.clientY;document.onmousemove=elementDrag;document.onmouseup=closeDragElement};
header.ontouchstart=function(e){pos3=e.touches[0].clientX;pos4=e.touches[0].clientY;document.ontouchmove=elementTouchDrag;document.ontouchend=closeDragElement};
function elementDrag(e){e.preventDefault();pos1=pos3-e.clientX;pos2=pos4-e.clientY;pos3=e.clientX;pos4=e.clientY;panel.style.top=(panel.offsetTop-pos2)+"px";panel.style.left=(panel.offsetLeft-pos1)+"px";panel.style.right="auto";panel.style.bottom="auto"}
function elementTouchDrag(e){pos1=pos3-e.touches[0].clientX;pos2=pos4-e.touches[0].clientY;pos3=e.touches[0].clientX;pos4=e.touches[0].clientY;panel.style.top=(panel.offsetTop-pos2)+"px";panel.style.left=(panel.offsetLeft-pos1)+"px";panel.style.right="auto";panel.style.bottom="auto"}
function closeDragElement(){document.onmouseup=null;document.onmousemove=null;document.ontouchend=null;document.ontouchmove=null}
}

document.addEventListener('click',function(e){
var target=e.target;
var actEl=target.closest('[data-action]');
if(!actEl)return;
var act=actEl.dataset.action;
switch(act){
case'open':showDetailModal(actEl.dataset.sid,Number(actEl.dataset.idx),actEl.dataset.id);break;
case'search':handleSearch();break;
case'prev':var ps1=getSectionPageState(currentSection);if(ps1.page>1){ps1.page--;renderList(currentSection);window.scrollTo(0,0);qs('.content-area').scrollTop=0}break;
case'next':var ps2=getSectionPageState(currentSection);if(ps2.page<ps2.total){ps2.page++;renderList(currentSection);window.scrollTo(0,0);qs('.content-area').scrollTop=0}break;
case'open-img':openImage(actEl.dataset.src);break;
case'open-html':showHtmlModal(actEl.dataset.sid,Number(actEl.dataset.idx),actEl.dataset.id);break;
case'close-modal':closeModal('.modal');break;
case'close-html':closeModal('.html-modal');break;
case'reload':reloadIframe();break;
case'history':qs('#secKey').value=actEl.dataset.q;handleSearch();break;
case'back-search':searchState.query="";var ps3=getSectionPageState(currentSection);ps3.filtered=null;ps3.page=1;renderList(currentSection);break;
case'clear-history':sessionStorage.removeItem('searchHist_'+currentSection);renderSearchHistory(currentSection);break;
case'copy-link':copyLink(actEl.dataset.url||'');break
}
});
document.addEventListener('DOMContentLoaded',function(){
var m=qs('.modal');
if(m)m.addEventListener('click',function(e){if(e.target===e.currentTarget)closeModal('.modal')});
var hm=qs('.html-modal');
if(hm)hm.addEventListener('click',function(e){if(e.target===e.currentTarget)closeModal('.html-modal')});
var im=qs('.img-modal');
if(im)im.addEventListener('click',function(e){if(e.target.tagName==='IMG'||e.target.classList.contains('img-container')||e.target.classList.contains('img-watermark')||e.target===im)closeModal('.img-modal')});
setTimeout(function(){if(!announceAgreed)closeAnnouncement()},88888);
initMusicPlayer()
});
document.addEventListener('keydown',function(e){
if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){qs('#secKey').focus();e.preventDefault()}
if(e.key==='Escape'){if(announceAgreed===false&&qs('#announcementModal')&&qs('#announcementModal').classList.contains('active')){closeAnnouncement();return}qsa('.modal.active,.html-modal.active,.img-modal.active').forEach(function(el){if(el.classList.contains('modal'))closeModal('.modal');else if(el.classList.contains('html-modal'))closeModal('.html-modal');else closeModal('.img-modal')})}
});
loadConfig()
})();
</script>
</body>
</html>
