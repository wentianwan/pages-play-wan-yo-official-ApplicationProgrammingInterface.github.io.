<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#ffffff">
<title>天彬TianBIN | 框架设定</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
:root{
--brand:#c9a227;--brand2:#a8861f;--brand3:#e8d48f;--bg:#ffffff;--fg:#1a1a1a;--line:#e8e2d2;
--card:#fbfaf5;--muted:#9a9484;--shadow:0 2px 14px rgba(0,0,0,.07);--nav-h:58px;
--safe-b:env(safe-area-inset-bottom,0px);--radius:10px;
}
html,body{height:100%;width:100%;overflow:hidden}
body{
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
background:var(--bg);color:var(--fg);font-size:15px;line-height:1.6;
-webkit-font-smoothing:antialiased;
}
body.announce-lock{overflow:hidden;position:fixed;width:100%;height:100%;touch-action:none}
body.no-scroll{overflow:hidden}
::-webkit-scrollbar{width:0;height:0}
.mobile-header{
position:sticky;top:0;z-index:100;height:50px;display:flex;align-items:center;justify-content:center;
background:var(--bg);border-bottom:1px solid var(--line);
font-weight:600;font-size:16px;letter-spacing:1.5px;
}
.mobile-header .h-brand{color:var(--brand)}
.content-area{
position:absolute;top:50px;bottom:calc(var(--nav-h) + var(--safe-b));left:0;right:0;
overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 24px;
}
.content-area.no-search{padding-top:12px}
.search-anchor{position:relative}
.search-bar{
position:sticky;top:0;z-index:90;background:var(--bg);padding:10px 12px;
border-bottom:1px solid var(--line);
}
.search-bar .s-row{display:flex;gap:8px;align-items:center}
.search-bar input{
flex:1;height:38px;border:1.5px solid var(--line);border-radius:19px;
padding:0 14px;font-size:14px;outline:none;background:var(--card);color:var(--fg);
-webkit-appearance:none;
}
.search-bar input:focus{border-color:var(--brand);background:#fff}
.s-btn{
border:none;border-radius:19px;height:38px;padding:0 15px;font-size:14px;
cursor:pointer;white-space:nowrap;transition:.15s;font-family:inherit;
}
.s-btn.primary{background:var(--brand);color:#fff}
.s-btn.primary:active{background:var(--brand2)}
.s-btn.ghost{background:var(--card);color:var(--muted)}
.s-btn.ghost:active{background:var(--line)}
.search-history-panel{
position:absolute;top:calc(100% + 2px);left:12px;right:12px;z-index:120;
background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);
box-shadow:var(--shadow);max-height:230px;overflow-y:auto;display:none;
}
.search-history-panel[data-open="1"]{display:block}
.search-history-panel .sh-head{
display:flex;justify-content:space-between;align-items:center;
padding:10px 14px;font-size:12px;color:var(--muted);
border-bottom:1px solid var(--line);
}
.search-history-panel .sh-head .sh-clear{cursor:pointer;color:var(--brand);font-size:13px}
.sh-list{padding:2px 0}
.sh-item{
display:flex;justify-content:space-between;align-items:center;
padding:11px 14px;font-size:14px;cursor:pointer;gap:10px;
}
.sh-item:active{background:var(--card)}
.sh-item .sh-kw{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-item .sh-del{color:var(--muted);font-size:18px;padding:0 4px;line-height:1;flex-shrink:0}
.sh-empty{padding:18px;text-align:center;font-size:13px;color:var(--muted)}
.card{
background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,transform .15s;
position:relative;overflow:hidden;
}
.card:active{border-color:var(--brand);transform:translateY(-1px)}
.card::before{
content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand);opacity:0;transition:.15s;
}
.card:active::before{opacity:1}
.card .card-title{font-size:15px;font-weight:600;margin-bottom:7px;line-height:1.5}
.card .card-snippet{font-size:13px;color:#6a6454;margin-top:7px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .card-meta{font-size:11.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.card .card-meta span{position:relative}
.card .card-meta span:not(:last-child)::after{content:"·";position:absolute;right:-7px;color:var(--line)}
.card .card-tags{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}
.card .card-tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--brand3);color:var(--brand2)}
mark{background:#fdf3d0;color:var(--brand2);border-radius:3px;padding:0 3px;font-weight:600}
.pagination{
display:flex;align-items:center;justify-content:center;gap:14px;
padding:18px 0 6px;font-size:13.5px;color:var(--muted);
}
.pagination button{
border:1px solid var(--line);background:var(--bg);border-radius:8px;
height:34px;padding:0 16px;font-size:13.5px;cursor:pointer;color:var(--fg);font-family:inherit;
}
.pagination button:disabled{opacity:.35;cursor:not-allowed}
.pagination button:not(:disabled):active{background:var(--card);border-color:var(--brand)}
.empty-tip{padding:44px 0;text-align:center;color:var(--muted);font-size:14px}
.empty-tip.warn{color:#c0392b}
.modal-mask{
position:fixed;inset:0;z-index:500;background:rgba(20,20,20,.6);
display:none;align-items:flex-end;justify-content:center;
}
.modal-mask.show{display:flex}
.modal-box{
width:100%;max-height:88vh;background:var(--bg);border-radius:16px 16px 0 0;
overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 18px calc(18px + var(--safe-b));
animation:slideUp .28s cubic-bezier(.2,.8,.2,1);
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-box .m-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:10px}
.modal-box .m-title{font-size:18px;font-weight:700;flex:1;line-height:1.4;word-break:break-word}
.modal-box .m-close{
width:28px;height:28px;border-radius:50%;background:var(--card);text-align:center;
line-height:26px;font-size:15px;cursor:pointer;flex-shrink:0;color:var(--muted);border:1px solid var(--line);
}
.modal-box .m-close:active{background:var(--line)}
.modal-box .m-meta{font-size:12px;color:var(--muted);margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.modal-box .m-body{font-size:14px;line-height:1.85;word-break:break-word}
.m-body p{margin-bottom:12px}
.m-body .m-images{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.m-body .m-images img{max-width:100%;border-radius:var(--radius);cursor:zoom-in;display:block}
.m-body .m-html-btn{
display:inline-block;margin:14px 0 4px;padding:9px 20px;border-radius:22px;
background:var(--brand);color:#fff;font-size:13.5px;cursor:pointer;font-family:inherit;
}
.m-body .m-html-btn:active{background:var(--brand2)}
.m-body .m-html-wrap{display:none;border-top:1px dashed var(--line);margin-top:12px;padding-top:14px}
.m-body .m-html-wrap.show{display:block;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.m-body .m-html-frame{border:1px solid var(--line);border-radius:var(--radius);width:100%;min-height:240px;background:#fff}
.modal-box .m-actions{display:flex;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.modal-box .m-actions button{
flex:1;height:42px;border-radius:var(--radius);border:1px solid var(--line);background:var(--bg);font-size:14px;cursor:pointer;font-family:inherit;
}
.modal-box .m-actions button.copy-btn{background:var(--brand);color:#fff;border-color:var(--brand)}
.modal-box .m-actions button:active{opacity:.8}
.img-modal{
position:fixed;inset:0;z-index:800;background:rgba(0,0,0,.96);
display:none;align-items:center;justify-content:center;
}
.img-modal.show{display:flex}
.img-modal img{max-width:100%;max-height:100%;object-fit:contain;padding:20px}
.img-modal .img-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;background:rgba(255,255,255,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;cursor:pointer}
.img-modal .img-nav.prev{left:10px}
.img-modal .img-nav.next{right:10px}
.img-watermark{position:fixed;inset:0;z-index:700;pointer-events:none;display:none;overflow:hidden}
.img-watermark.show{display:block}
.img-watermark span{
position:absolute;color:rgba(255,255,255,.45);font-size:18px;font-weight:700;
transform:rotate(-32deg);white-space:nowrap;letter-spacing:2px;
animation:wmCycle 5s linear infinite;
}
@keyframes wmCycle{0%,100%{opacity:.35}50%{opacity:.6}}
.toast{
position:fixed;top:18%;left:50%;transform:translateX(-50%) translateY(-20px);z-index:999;
background:rgba(38,38,38,.94);color:#fff;padding:11px 24px;border-radius:22px;
font-size:13.5px;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.music-btn{
position:fixed;right:14px;bottom:calc(var(--nav-h) + var(--safe-b) + 14px);z-index:300;
width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;
display:flex;align-items:center;justify-content:center;cursor:pointer;
box-shadow:0 4px 14px rgba(201,162,39,.4);font-size:17px;transition:.2s;
}
.music-btn.playing{animation:mpSpin 3s linear infinite}
@keyframes mpSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.music-panel{
position:fixed;right:14px;bottom:calc(var(--nav-h) + var(--safe-b) + 70px);z-index:300;
width:232px;background:var(--bg);border:1px solid var(--line);border-radius:12px;
box-shadow:0 8px 30px rgba(0,0,0,.15);padding:12px;display:none;
}
.music-panel.show{display:block;animation:fadeIn .2s}
.music-panel .mp-info{font-size:13px;font-weight:600;margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music-panel .mp-ctrl{display:flex;gap:8px}
.music-panel .mp-ctrl button{
flex:1;height:32px;border:1px solid var(--line);background:var(--card);
border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;
}
.music-panel .mp-ctrl button:active{background:var(--brand);color:#fff;border-color:var(--brand)}
.music-panel iframe{width:100%;height:80px;border:0;margin-top:10px;border-radius:6px;background:#f5f5f5}
.loading-full{
position:fixed;inset:0;z-index:2000;background:var(--bg);
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
font-size:14px;color:var(--muted);
}
.loading-full .lf-spin{
width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brand);
border-radius:50%;animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#wm-canvas{position:fixed;inset:0;z-index:600;pointer-events:none}
.announce-mask{
position:fixed;inset:0;z-index:99999;
background:rgba(44,44,44,.68);
display:none;align-items:center;justify-content:center;padding:16px;
overflow-y:auto;
}
.announce-mask.show{display:flex;animation:fadeIn .25s}
.announce-box{
width:100%;max-width:440px;background:var(--bg);border-radius:14px;
overflow:hidden;max-height:88vh;display:flex;flex-direction:column;
box-shadow:0 24px 70px rgba(0,0,0,.45);
}
.announce-box .ab-head{
padding:16px 18px 12px;display:flex;justify-content:space-between;align-items:center;
border-bottom:1px solid var(--line);
}
.announce-box .ab-title{font-size:17px;font-weight:700;color:var(--brand)}
.announce-box .ab-body{
padding:14px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;
}
.announce-box .ab-content{font-size:14px;line-height:1.95;white-space:pre-wrap;color:#444}
.announce-box .ab-images{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.announce-box .ab-images img{max-width:100%;border-radius:var(--radius)}
.announce-box .ab-terms-btn{
display:inline-block;margin-top:12px;padding:9px 20px;border-radius:22px;
background:var(--brand);color:#fff;font-size:13.5px;cursor:pointer;font-family:inherit;
}
.announce-box .ab-terms-wrap{display:none;border-top:1px dashed var(--line);margin-top:14px;padding-top:14px}
.announce-box .ab-terms-wrap.show{display:block}
.announce-box .ab-terms-frame{border:1px solid var(--line);border-radius:var(--radius);width:100%;min-height:300px;background:#fff}
.announce-box .ab-terms-msg{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}
.announce-box .ab-foot{
padding:14px 18px calc(14px + var(--safe-b));border-top:1px solid var(--line);
display:flex;flex-direction:column;gap:10px;
}
.announce-box .ab-progress{width:100%;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.announce-box .ab-progress span{display:block;height:100%;width:0;background:var(--brand);transition:.15s}
.announce-box .ab-tip{font-size:12px;text-align:center;color:#e74c3c;min-height:16px;line-height:1.4}
.announce-box .ab-btn{
width:100%;height:46px;border-radius:11px;border:none;font-size:15px;font-weight:600;
background:var(--card);color:var(--muted);cursor:not-allowed;font-family:inherit;transition:.2s;
}
.announce-box .ab-btn.ready{background:var(--brand);color:#fff;cursor:pointer;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,162,39,.5)}50%{box-shadow:0 0 0 8px rgba(201,162,39,0)}}
.wm-overlay{position:fixed;inset:0;z-index:99990;pointer-events:none;display:none;overflow:hidden}
.wm-overlay.show{display:block}
.wm-overlay span{
position:absolute;font-size:28px;font-weight:700;color:rgba(201,162,39,.2);
transform:rotate(-28deg);white-space:nowrap;letter-spacing:5px;
}
.share-mask{position:fixed;inset:0;z-index:700;background:rgba(0,0,0,.5);display:none;align-items:flex-end}
.share-mask.show{display:flex}
.share-box{width:100%;background:var(--bg);border-radius:14px 14px 0 0;padding:18px;animation:slideUp .25s}
.share-box .sb-title{font-size:15px;font-weight:600;text-align:center;margin-bottom:16px}
.share-box .sb-opts{display:flex;gap:12px;justify-content:center}
.share-box .sb-opt{flex:1;max-width:80px;text-align:center;cursor:pointer;font-size:12px;color:var(--muted)}
.share-box .sb-opt .sb-ic{width:48px;height:48px;margin:0 auto 6px;border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:22px}
.share-box .sb-cancel{margin-top:16px;height:42px;border-radius:var(--radius);background:var(--card);text-align:center;line-height:42px;font-size:14px;cursor:pointer;border:1px solid var(--line)}
.skel{background:linear-gradient(90deg,var(--card) 25%,#f0ede3 50%,var(--card) 75%);background-size:200% 100%;animation:skel 1.2s infinite;border-radius:6px}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}
.mobile-nav{
position:fixed;bottom:0;left:0;right:0;z-index:100;height:calc(var(--nav-h) + var(--safe-b));
display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:var(--safe-b);
}
.mobile-nav .nav-item{
flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
font-size:9.5px;color:var(--muted);gap:3px;cursor:pointer;transition:.2s;position:relative;
}
.mobile-nav .nav-item .nav-icon{width:22px;height:22px;display:block;background-repeat:no-repeat;background-position:center;background-size:contain;transition:.2s}
.mobile-nav .nav-item.active{color:var(--brand)}
.mobile-nav .nav-item.active .nav-icon{transform:scale(1.18)}
.mobile-nav .nav-item .badge-dot{position:absolute;width:6px;height:6px;border-radius:50%;background:#e74c3c;margin-left:16px;margin-bottom:20px}
.ico-frame{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23777'><path d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z'/><path d='M14 2v6h6'/></svg>")}
.mobile-nav .nav-item.active .ico-frame{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23c9a227'><path d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z'/><path d='M14 2v6h6'/></svg>")}
.ico-dev{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23777' stroke-width='1.8' stroke-linejoin='round'><rect x='3' y='3' width='18' height='18' rx='2'/><path d='M8 8l-2.5 4L8 16M16 8l2.5 4L16 16'/></svg>")}
.mobile-nav .nav-item.active .ico-dev{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c9a227' stroke-width='1.8' stroke-linejoin='round'><rect x='3' y='3' width='18' height='18' rx='2'/><path d='M8 8l-2.5 4L8 16M16 8l2.5 4L16 16'/></svg>")}
.ico-book{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23777'><path d='M4 3.5C4 2.67 4.67 2 5.5 2h14v17H5.5A1.5 1.5 0 0 1 4 17.5v-14zM18.5 2H20a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H5.5'/></svg>")}
.mobile-nav .nav-item.active .ico-book{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23c9a227'><path d='M4 3.5C4 2.67 4.67 2 5.5 2h14v17H5.5A1.5 1.5 0 0 1 4 17.5v-14zM18.5 2H20a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H5.5'/></svg>")}
</style>
</head>
<body>

<div class="loading-full" id="global-loading"><div class="lf-spin"></div><span>拉取加载数据中...</span></div>

<header class="mobile-header"><span class="h-brand" id="site-title">天彬TianBIN</span></header>

<div class="search-anchor">
<div class="search-bar" id="search-bar" style="display:none">
<div class="s-row">
<input type="search" id="search-input" placeholder="输入编号查询..." autocomplete="off" enterkeyhint="search">
<button class="s-btn ghost" id="btn-clear">×</button>
<button class="s-btn primary" id="btn-search">查询</button>
<button class="s-btn ghost" id="btn-back">返回</button>
</div>
<div class="search-history-panel" id="search-history-panel">
<div class="sh-head"><span>搜索历史</span><span class="sh-clear" data-act="clear-history">清空</span></div>
<div class="sh-list" id="sh-list"></div>
</div>
</div>
</div>

<main class="content-area no-search" id="content-area"></main>

<nav class="mobile-nav" id="mobile-nav"></nav>

<div class="modal-mask" id="modal-mask">
<div class="modal-box" id="modal-box">
<div class="m-head"><div class="m-title" id="m-title"></div><div class="m-close" id="m-close">×</div></div>
<div class="m-meta" id="m-meta"></div>
<div class="m-body" id="m-body"></div>
<div class="m-actions">
<button class="copy-btn" id="m-copy">复制链接</button>
<button id="m-share">分享</button>
<button id="m-close2">关闭</button>
</div>
</div>
</div>

<div class="img-modal" id="img-modal">
<div class="img-nav prev" id="img-prev">‹</div>
<img id="img-view" src="">
<div class="img-nav next" id="img-next">›</div>
</div>
<div class="img-watermark" id="img-wm"></div>
<div class="toast" id="toast"></div>

<div class="share-mask" id="share-mask">
<div class="share-box">
<div class="sb-title">分享</div>
<div class="sb-opts">
<div class="sb-opt" data-sh="copy"><div class="sb-ic">⧉</div>复制链接</div>
<div class="sb-opt" data-sh="wechat"><div class="sb-ic">✈</div>发送给朋友</div>
</div>
<div class="sb-cancel" id="share-cancel">取消</div>
</div>
</div>

<div class="music-btn" id="music-btn">♪</div>
<div class="music-panel" id="music-panel">
<div class="mp-info" id="mp-info">未播放</div>
<div class="mp-ctrl">
<button id="mp-prev">上一首</button>
<button id="mp-toggle">播放</button>
<button id="mp-next">下一首</button>

function setupKeyMap(){

var fn=map[k];if(fn){e.preventDefault();fn(e);}
};

return this;
}

function setupBlurGuard(){

function setupSelect(){

function setupCopy(){
this.text=function(t){

}
function setupPaste(){
this.text=function(cb){
document.addEventListener("paste",function h(e){

function setupFile(){
this.read=function(file,cb){
var r=new FileReader();

function setupDownload(){

function setupWakeLock(){
